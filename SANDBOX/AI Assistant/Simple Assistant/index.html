<!--

    Provides a compact message stream, responsive composer, and accessible status feedback.

Module: Simple Assistant
Author: hypo69
Copyright: (C) 2026 hypo69
===============================================================================

<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f1ea">
  <title>Simple Assistant</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="brand-mark" aria-hidden="true">SA</div>
      <div>
        <p class="eyebrow">AI ASSISTANT</p>
        <h1>Simple Assistant</h1>
      </div>
      <span class="connection-state" id="connection-state"><span class="state-dot"></span><span id="state-label">&#1043;&#1086;&#1090;&#1086;&#1074;</span></span>
    </header>

    <section class="chat-panel" aria-label="&#1063;&#1072;&#1090;">
      <div class="conversation" id="conversation" aria-live="polite">
        <div class="welcome-message" id="welcome-message">
          <span class="welcome-kicker">&#1042;&#1072;&#1096; &#1083;&#1080;&#1095;&#1085;&#1099;&#1081; &#1076;&#1080;&#1072;&#1083;&#1086;&#1075;</span>
          <h2>&#1063;&#1077;&#1084; &#1084;&#1086;&#1075;&#1091; &#1087;&#1086;&#1084;&#1086;&#1095;&#1100;?</h2>
          <p>&#1053;&#1072;&#1087;&#1080;&#1096;&#1080;&#1090;&#1077; &#1074;&#1086;&#1087;&#1088;&#1086;&#1089; &#1080;&#1083;&#1080; &#1079;&#1072;&#1076;&#1072;&#1095;&#1091;, &#1080; &#1084;&#1099; &#1085;&#1072;&#1095;&#1085;&#1105;&#1084; &#1089; &#1087;&#1086;&#1090;&#1086;&#1082;&#1086;&#1074;&#1086;&#1075;&#1086; &#1086;&#1090;&#1074;&#1077;&#1090;&#1072;.</p>
        </div>
      </div>

      <div class="composer-wrap">
        <form class="composer" id="chat-form">
          <label class="sr-only" for="message-input">&#1057;&#1086;&#1086;&#1073;&#1097;&#1077;&#1085;&#1080;&#1077;</label>
          <textarea id="message-input" rows="1" maxlength="12000" placeholder="&#1053;&#1072;&#1087;&#1080;&#1096;&#1080;&#1090;&#1077; &#1089;&#1086;&#1086;&#1073;&#1097;&#1077;&#1085;&#1080;&#1077;..." autocomplete="off"></textarea>
          <button class="send-button" id="send-button" type="submit" aria-label="&#1054;&#1090;&#1087;&#1088;&#1072;&#1074;&#1080;&#1090;&#1100;" title="&#1054;&#1090;&#1087;&#1088;&#1072;&#1074;&#1080;&#1090;&#1100;">
            <span aria-hidden="true">&#8593;</span>
          </button>
        </form>
        <div class="composer-footer">
          <span id="hint-text">Enter &#8212; &#1086;&#1090;&#1087;&#1088;&#1072;&#1074;&#1080;&#1090;&#1100; &#183; Shift + Enter &#8212; &#1085;&#1086;&#1074;&#1072;&#1103; &#1089;&#1090;&#1088;&#1086;&#1082;&#1072;</span>
          <button class="clear-button" id="clear-button" type="button">&#1054;&#1095;&#1080;&#1089;&#1090;&#1080;&#1090;&#1100;</button>
        </div>
      </div>
    </section>
  </main>
  <script src="./main.js" defer></script>
</body>
</html>
