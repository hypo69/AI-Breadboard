site_name: AI-Breadboard
site_description: Interactive AI Model Testbench & Breadboard
site_url: !ENV [READTHEDOCS_CANONICAL_URL, 'http://localhost:8000']
repo_url: https://github.com/hypo69/AI-Breadboard
edit_uri: edit/master/docs/
docs_dir: docs/ru
exclude_docs: |
  **/README.md

# Theme
theme:
  name: material
  language: ru
  palette:
    primary: indigo
    accent: indigo
  favicon: assets/favicon.png
  logo: assets/logo.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - toc.integrate
    - content.code.copy

# Navigation
nav:
  - Главная: index.md
  - Руководство:
    - Обзор: manual/index.md
    - Начало работы: manual/getting-started.md
    - Установка: manual/installation.md
    - Запуск сервера: manual/RUN.md
    - Конфигурация и секреты: manual/secrets.md
    - Справочник конфигурации: manual/config-reference.md
    - Примеры использования: manual/usage-examples.md
    - Решение проблем: manual/troubleshooting.md
  - Плагины:
    - Обзор: plugins/index.md
    - Каталог: plugins/catalog.md
    - Архитектура: plugins/architecture.md
    - Разработка: plugins/development.md
  - Навыки (Skills):
    - Обзор: skills/index.md
    - Каталог: skills/catalog.md
    - Архитектура: skills/architecture.md
    - Разработка: skills/development.md
  - Приложения (Apps):
    - Обзор: apps/index.md
    - Каталог: apps/catalog.md
    - Платформа корпоративных знаний: guides/apps/enterprise_knowledge.md
  - MCP Серверы:
    - Обзор: mcp/index.md
    - Каталог: mcp/catalog.md
    - Руководство: mcp/guide.md
  - Архитектура:
    - Обзор: architecture/overview.md
    - Компоненты: architecture/components.md
    - Безопасность API: architecture/api-security.md
    - Модели данных: architecture/data-models.md
    - Провайдер Gemini: architecture/gemini-provider.md
  - Гайды:
    - Обзор: guides/index.md
    - Создание агентов: guides/creating-agents.md
    - Разработка плагинов: guides/developing-plugins.md
    - Разработка навыков: guides/developing-skills.md
    - Чат-интерфейс: guides/chat-interface.md
    - Google OAuth: guides/google-oauth-setup.md
    - Google Workspace: guides/google-workspace.md
    - Стратегия тестирования: guides/testing-strategy.md
  - API Reference:
    - Обзор: api/index.md
    - AI оркестратор: api/ai.md
    - RAG-движок: api/rag.md
    - Плагины: api/plugins.md
    - Агенты: api/agents.md
    - Навыки: api/skills.md
    - REST API: api/utils.md
    - Enterprise Knowledge Platform: api/enterprise_knowledge.md
  - Разработчику:
    - Обзор: developer/index.md
    - Changelog: changelog.md
    - Контрибуция: contributing.md

# Plugins
plugins:
  - search:
      lang:
        - ru
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - .
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            show_signature_annotations: true
            show_if_no_docstring: false
            heading_level: 2
            preload_modules:
              - src

# Markdown extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

# Custom CSS / JS
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - js/chat.js

# Site metadata
extra:
  version: 1.0.0
  authors:
    - hypo69
  license: MIT
  repository: github

# Validation
strict: false

