# MkDocs configuration for the AI Breadboard project.
# Site documentation build settings, navigation,
# theme settings, and enabled extensions.
# Documentation is used to store user
# and developer instructions in a unified accessible format.
# =============================================================================
# Project: AI Breadboard
# Description: Interactive AI Model Testbench & Breadboard
# =============================================================================

site_name: AI Breadboard
site_description: Interactive AI Model Testbench & Breadboard
site_url: https://hypo69.github.io/AI-Breadboard/
repo_url: https://github.com/hypo69/AI-Breadboard
edit_uri: edit/master/docs/

# Theme
theme:
  name: material
  language: ru
  palette:
    primary: indigo
    accent: indigo
  favicon: assets/favicon.png
  logo: assets/logo.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - toc.integrate
    - content.code.copy
    - content.tabs.link

