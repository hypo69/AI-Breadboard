# Plugins
plugins:
  - search:
      lang:
        - ru
        - en
        - es
  - mkdocstrings:
      handlers:
        python:
          setup_commands:
            - "import sys"
            - "sys.path.insert(0, 'core')"

# Copyright
copyright: Copyright © 2026 hypo69. Licensed under MIT.

# Markdown Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - fenced_code

# Custom CSS
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - js/chat.js

# Site metadata
extra:
  version: 1.0.0
  generator: false
  authors:
    - hypo69
  license: MIT
  repository: github
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hypo69/AI-Breadboard

# Validation
strict: false
