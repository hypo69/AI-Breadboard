site_name: AI-Breadboard
site_description: Interactive AI Model Testbench & Breadboard
site_url: !ENV [READTHEDOCS_CANONICAL_URL, 'http://localhost:8000']
repo_url: https://github.com/hypo69/AI-Breadboard
edit_uri: edit/master/docs/

# Theme
theme:
  name: material
  language: en
  palette:
    primary: indigo
    accent: indigo
  favicon: assets/favicon.png
  logo: assets/logo.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - toc.integrate
    - content.code.copy

# Navigation
nav:
  - Главная: ru/index.md
  - Руководство:
      - Начало работы: ru/manual/getting-started.md
      - Установка: ru/manual/installation.md
      - Запуск сервера: ru/manual/RUN.md
      - Конфигурация и секреты: ru/manual/configuration.md
      - Справочник config.json: ru/manual/config.md
      - Примеры использования: ru/manual/usage-examples.md
      - Решение проблем: ru/manual/troubleshooting.md
  - Плагины:
      - Обзор: ru/plugins/index.md
      - Каталог: ru/plugins/catalog.md
      - Архитектура: ru/plugins/architecture.md
      - Разработка: ru/plugins/development.md
  - Навыки (Skills):
      - Обзор: ru/skills/index.md
      - Каталог: ru/skills/catalog.md
      - Архитектура: ru/skills/architecture.md
      - Разработка: ru/skills/development.md
  - Приложения (Apps):
      - Обзор: ru/apps/index.md
      - Каталог: ru/apps/catalog.md
  - MCP Серверы:
      - Обзор: ru/mcp/index.md
      - Каталог: ru/mcp/catalog.md
      - Руководство: ru/mcp/guide.md
  - Архитектура:
      - Обзор: ru/architecture/overview.md
      - Компоненты: ru/architecture/components.md
      - Безопасность API: ru/architecture/api-security.md
      - Модели данных: ru/architecture/data-models.md
      - Провайдер Gemini: ru/architecture/gemini-provider.md
  - Гайды:
      - Создание агентов: ru/guides/creating-agents.md
      - Разработка плагинов: ru/guides/developing-plugins.md
      - Разработка навыков: ru/guides/developing-skills.md
      - Чат-интерфейс: ru/guides/chat-interface.md
      - Google OAuth: ru/guides/google-oauth-setup.md
      - Google Workspace: ru/guides/google-workspace.md
      - Стратегия тестирования: ru/guides/testing-strategy.md
  - API Reference:
      - Обзор: ru/api/index.md
      - AI оркестратор: ru/api/ai.md
      - RAG-движок: ru/api/rag.md
      - Плагины: ru/api/plugins.md
      - Агенты: ru/api/agents.md
      - Навыки: ru/api/skills.md
      - REST API: ru/api/utils.md
  - Разработчику:
      - Обзор: ru/developer/index.md
      - Changelog: ru/changelog.md
      - Контрибуция: ru/contributing.md

# Plugins
plugins:
  - search:
      lang:
        - en
        - ru
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: ru
          name: Русский
          build: true
        - locale: es
          name: Español
          build: true
        - locale: ar
          name: العربية
          build: true
        - locale: he
          name: עברית
          build: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - .
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            show_signature_annotations: true
            show_if_no_docstring: false
            heading_level: 2
            preload_modules:
              - src

# Markdown extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

# Custom CSS / JS
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - js/chat.js

# Site metadata
extra:
  version: 1.0.0
  authors:
    - hypo69
  license: MIT
  repository: github

# Validation
strict: false

