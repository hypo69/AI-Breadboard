# Конфигурация pytest.
# Здесь задаются параметры запуска тестов проекта ai-breadboard.
# Указанный набор путей, маркеров и отчётов нужен для проверки
# качества покрытия рабочего кода без лишних служебных файлов.
# Параметр --cov-config=.coveragerc связывает запуск тестов
# с настройками coverage.py для унифицированного анализа покрытия.

[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --cov=core --cov=plugins --cov=scripts --cov-report=term-missing --cov-report=html:htmlcov --cov-report=xml:coverage.xml --cov-config=.coveragerc --strict-markers
markers =
    unit: unit tests
    integration: integration tests
    slow: slow running tests
    database: database tests
    api: API endpoint tests
    asyncio: asyncio tests