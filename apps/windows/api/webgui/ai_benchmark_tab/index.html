<style>

    font-weight: 600;
    margin-bottom: 0.25rem;
  }
  .bm-card-value {
    font-size: 1.4rem;
    font-weight: 700;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

  }
  .bm-panel {
    background: var(--surface-1) !important;
    border: 1px solid var(--border-color) !important;
    border-radius: 8px;
    margin-bottom: 0.75rem;

  }
  .bm-panel-header {
    background: var(--surface-2) !important;

<div class="bm-container">
  <!-- Benchmark Run Form -->
  <div class="bm-panel mb-3">

    </div>
    <div class="p-3">

          <select class="form-select form-select-sm" id="bm-provider-select">
            <option value="gemini" selected>Google Gemini API</option>
            <option value="ollama">Ollama (Local)</option>
            <option value="foundry">Microsoft Foundry Local</option>
            <option value="onnx">ONNX DirectML / NPU</option>

        </div>
      </div>
      <div class="mt-2">

    </div>
    <div class="col-md-3 col-6">

      </div>
    </div>
  </div>

      <span><i class="bi bi-clock-history me-1"></i> <span data-i18n="auto___a58a32"></span></span>
