<!-- TTS Settings Tab -->
<div class="container-fluid">
<div class="alert alert-info">
<h5 data-i18n="tts.title">🗣️ Настройка TTS (Синтез речи)</h5>
<p data-i18n="tts.description">Установите голос и движок по умолчанию для озвучки описания медиафайлов, а также протестируйте их звучание.</p>
</div>
<div class="row g-3">
<!-- LEFT: Settings Configuration -->
<div class="col-5">
<div class="card mb-3" data-panel-id="panel-tts-1" id="panel-tts-1">
<div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
<span>⚙️ Параметры озвучки</span>
</div>
<div class="card-body">
<form id="admin-tts-form" onsubmit="event.preventDefault();">
<!-- Active Voice Badge -->
<div class="mb-3" id="admin-active-voice-container" style="display: none;">
<span class="badge bg-success d-inline-flex align-items-center gap-1 p-2">
<i class="bi bi-check-circle-fill"></i>
<span>Активный голос: <strong id="admin-active-voice-name">...</strong></span>
</span>
</div>
<!-- Engine Selection -->
<div class="mb-3">
<label class="form-label small fw-bold" for="admin-tts-engine">Система синтеза:</label>
<select class="form-select form-select-sm" id="admin-tts-engine">
<option value="browser">Web Speech API (Браузерная)</option>
<option value="gtts">Google TTS (Базовая)</option>
<option selected="" value="edge-tts">Microsoft Edge TTS (Нейросетевая)</option>
<option value="silero">Silero TTS (Локальная оффлайн)</option>
</select>
</div>
<!-- Voice Selection -->
<div class="mb-3" id="admin-voice-select-container">
<label class="form-label small fw-bold" for="admin-tts-voice">Голос / Спикер:</label>
<select class="form-select form-select-sm" id="admin-tts-voice">
<!-- Dynamically populated -->
</select>
</div>
<!-- Save Default Button -->
<div class="d-grid">
<button class="btn btn-success btn-sm" id="btn-admin-tts-save" type="button">
<i class="bi bi-floppy"></i> Применить по умолчанию
              </button>
</div>
</form>
</div>
</div>
</div>
<!-- RIGHT: Text to Speech Playground -->
<div class="col-7">
<div class="card" data-panel-id="panel-tts-2" id="panel-tts-2">
<div class="card-header bg-dark text-white">
<span>🎯 Тестирование озвучки</span>
</div>
<div class="card-body">
<div class="mb-3">
<label class="form-label small fw-bold" for="admin-tts-text">Текст для проверки:</label>
<textarea class="form-control form-control-sm" id="admin-tts-text" rows="5">Привет! Это проверка работы модульной системы синтеза речи. Выберите систему и голос слева, затем нажмите кнопку «Озвучить» для воспроизведения.</textarea>
</div>
<div class="d-flex align-items-center gap-3">
<button class="btn btn-primary btn-sm px-4" id="btn-admin-tts-speak" type="button">
<i class="bi bi-play-fill"></i> Озвучить текст
            </button>
<!-- Loading Spinner -->
<div class="status-badge small text-muted d-none" id="admin-tts-status">
<div class="spinner-border spinner-border-sm text-primary" role="status"></div>
<span class="ms-1" id="admin-status-text">Генерация аудио...</span>
</div>
</div>
<!-- Audio Player Container -->
<div class="mt-4 border-top pt-3 d-none" id="admin-tts-player-container">
<label class="form-label small fw-bold">Результат генерации:</label>
<audio class="w-100" controls="" id="admin-tts-audio-player"></audio>
</div>
</div>
</div>
</div>
</div>
</div>
