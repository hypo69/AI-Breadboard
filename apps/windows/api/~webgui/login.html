  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function() {
      'use strict';

      // ── <span data-i18n="auto__function_getsystemtheme_return_window_matchmedia_window_matchmedia_prefers_color_scheme_dark_matches_dark_light_function_applytheme_mode_mode_light_dark_system_const_resolved_mode_system_getsystemtheme_mode_document_documentelement_setattribute_data_theme_resolved_document_documentelement_setattribute_data_bs_theme_resolved_const_icon_document_getelementbyid_theme_icon_if_icon_if_mode_light_icon_classname_bi_bi_sun_fill_text_warning_else_if_mode_dark_icon_classname_bi_bi_moon_stars_fill_text_primary_else_icon_classname_bi_bi_circle_half_text_info_function_inittheme_const_saved_localstorage_getitem_theme_system_applytheme_saved__3cf8b5"></span>
        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if ((localStorage.getItem('theme') || 'system') === 'system') {
              applyTheme('system');
            }
          });
        }
      }

      // <span data-i18n="auto___1e12a4"></span> system → light → dark → system
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const cur = localStorage.getItem('theme') || 'system';
        const next = { system: 'light', light: 'dark', dark: 'system' }[cur] || 'system';
        localStorage.setItem('theme', next);
        applyTheme(next);
      });

      initTheme();

      // ── I18n ────────────────────────────────────────────────────────────────
      const i18nDict = {
        ru: {
          appDesc: '<span data-i18n="auto__tablogin_tabreg_btngoogle_google_oremail_email_email_pass_regname_regpass_btnlogin_btnreg_passplaceholder_6_nameplaceholder__5fd327"></span>'
        },
        en: {
          appDesc: 'Sign in to access AI Breadboard services',
          tabLogin: 'Sign In', tabReg: 'Sign Up',
          btnGoogle: 'Continue with Google', orEmail: 'or via Email',
          email: 'Email', pass: 'Password',
          regName: 'Full Name', regPass: 'Create Password',
          btnLogin: 'Sign In', btnReg: 'Create Account',
          passPlaceholder: 'Minimum 6 characters', namePlaceholder: 'John Doe'
        },
        he: {
          appDesc: 'התחבר כדי לגשת לשירותי AI',
          tabLogin: 'התחברות', tabReg: 'הרשמה',
          btnGoogle: 'המשך עם Google', orEmail: 'או באמצעות דוא"ל',
          email: 'דוא"ל', pass: 'סיסמה',
          regName: 'שם מלא', regPass: 'צור סיסמה',
          btnLogin: 'התחבר', btnReg: 'הרשמה',
          passPlaceholder: 'לפחות 6 תווים', namePlaceholder: 'ישראל ישראלי'
        }
      };

      const langSelector = document.getElementById('auth-lang-selector');
      const savedLang = localStorage.getItem('app_language') || 'ru';
      if (langSelector) {
        langSelector.value = savedLang;
        langSelector.addEventListener('change', (e) => {
          const l = e.target.value;
          localStorage.setItem('app_language', l);
          updateLanguageTexts(l);
        });
      }

      function updateLanguageTexts(lang) {
        const d = i18nDict[lang] || i18nDict.ru;
        document.getElementById('title-app-desc').textContent   = d.appDesc;
        document.getElementById('label-tab-login').textContent  = d.tabLogin;
        document.getElementById('label-tab-register').textContent = d.tabReg;
        document.getElementById('label-google-auth').textContent = d.btnGoogle;
        document.getElementById('label-or-email').textContent   = d.orEmail;
        document.getElementById('label-email-login').textContent = d.email;
        document.getElementById('label-pass-login').textContent = d.pass;
        document.getElementById('label-reg-name').textContent   = d.regName;
        document.getElementById('label-reg-email').textContent  = d.email;
        document.getElementById('label-reg-pass').textContent   = d.regPass;
        document.getElementById('label-btn-login').textContent  = d.btnLogin;
        document.getElementById('label-btn-reg').textContent    = d.btnReg;
        document.getElementById('reg-password').placeholder     = d.passPlaceholder;
        document.getElementById('reg-name').placeholder         = d.namePlaceholder;
      }
      updateLanguageTexts(savedLang);

      // ── <span data-i18n="auto___8c24cb"></span> ──────────────────────────────────────────────────────────────
      function showAlert(msg, type = 'danger') {
        const el = document.getElementById('auth-alert');
        el.className = `alert alert-${type} mb-3 py-2 small`;
        el.textContent = msg;
        el.classList.remove('d-none');
      }
      function hideAlert() {
        document.getElementById('auth-alert').classList.add('d-none');
      }

      // ── Google OAuth ─────────────────────────────────────────────────────────
      document.getElementById('btn-google-auth').addEventListener('click', () => {
        window.location.href = '/auth/google?next=/';
      });

      // ── <span data-i18n="auto___07205a"></span> ─────────────────────────────────────────────────────────────────
      let pendingVerificationEmail = '';
      document.getElementById('form-login').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();
        const email    = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const spinner  = document.getElementById('login-spinner');
        const btn      = document.getElementById('btn-submit-login');
        btn.disabled = true;
        spinner.classList.remove('d-none');
        try {
          const res  = await fetch('/auth/login/email', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();
          if (!res.ok) {
            if (res.status === 403 && data.detail && data.detail.includes('<span data-i18n="auto__pendingverificationemail_email_const_desc_document_getelementbyid_verify_modal_desc_if_desc_desc_textcontent_email_new_bootstrap_modal_document_getelementbyid_verifymodal_show_showalert_data_detail_warning_else_showalert_data_detail_danger_return_showalert__312abe"></span>...', 'success');
          setTimeout(() => { window.location.href = '/'; }, 400);
        } catch (err) {
          showAlert('<span data-i18n="auto__err_message_danger_finally_btn_disabled_false_spinner_classlist_add_d_none__4a8d03"></span> ───────────────────────────────────────────────────────────
      document.getElementById('form-register').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();
        const name     = document.getElementById('reg-name').value.trim();
        const email    = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;
        const spinner  = document.getElementById('reg-spinner');
        const btn      = document.getElementById('btn-submit-reg');
        btn.disabled = true;
        spinner.classList.remove('d-none');
        try {
          const res  = await fetch('/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password, name })
          });
          const data = await res.json();
          if (!res.ok) {
            showAlert(data.detail || '<span data-i18n="auto__danger_return_pendingverificationemail_email_const_desc_document_getelementbyid_verify_modal_desc_if_desc_desc_textcontent_email_new_bootstrap_modal_document_getelementbyid_verifymodal_show_showalert_info_catch_err_showalert_err_message_danger_finally_btn_disabled_false_spinner_classlist_add_d_none__0af33f"></span> ────────────────────────────────────────────────────
      document.getElementById('btn-submit-verify').addEventListener('click', async () => {
        const codeInput = document.getElementById('verify-code-input');
        const alertEl   = document.getElementById('verify-alert');
        const spinner   = document.getElementById('verify-spinner');
        const btnVerify = document.getElementById('btn-submit-verify');
        const code = codeInput.value.trim();
        if (!code) return;
        alertEl.classList.add('d-none');
        btnVerify.disabled = true;
        spinner.classList.remove('d-none');
        try {
          const res  = await fetch('/auth/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: pendingVerificationEmail, code })
          });
          const data = await res.json();
          if (!res.ok) {
            alertEl.className = 'alert alert-danger py-1 small';
            alertEl.textContent = data.detail || '<span data-i18n="auto__alertel_classlist_remove_d_none_return_alertel_classname_alert_alert_success_py_1_small_alertel_textcontent__1f59da"></span>.';
          alertEl.classList.remove('d-none');
          setTimeout(() => {
            const modal = bootstrap.Modal.getInstance(document.getElementById('verifyModal'));
            if (modal) modal.hide();
            document.getElementById('tab-login-btn').click();
            document.getElementById('login-email').value = pendingVerificationEmail;
            showAlert('<span data-i18n="auto___47a0fe"></span>.', 'success');
          }, 1200);
        } catch (err) {
          alertEl.className = 'alert alert-danger py-1 small';
          alertEl.textContent = err.message;
          alertEl.classList.remove('d-none');
        } finally {
          btnVerify.disabled = false;
          spinner.classList.add('d-none');
        }
      });

    })();
  </script>
</body>
