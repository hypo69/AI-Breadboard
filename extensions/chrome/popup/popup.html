<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-Breadboard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <img src="../icons/icon48.png" alt="AI-Breadboard" class="logo">
      <div class="header-text">
        <h3 id="txt-title">AI-Breadboard</h3>
        <div id="server-status" class="status-badge checking">
          <span class="dot"></span>
          <span id="status-text">Проверка...</span>
        </div>
      </div>
    </div>

    <!-- User Authentication Card -->
    <div class="auth-section">
      <!-- Shown when logged in -->
      <div id="user-profile-card" class="user-card d-none">
        <img id="user-avatar" src="../icons/icon48.png" alt="Avatar" class="user-avatar">
        <div class="user-info">
          <div id="user-name" class="user-name">User</div>
          <div id="user-email" class="user-email">email@gmail.com</div>
        </div>
        <button id="btn-logout" class="btn-icon" title="Выйти">🚪</button>
      </div>

      <!-- Shown when NOT logged in -->
      <div id="guest-login-card" class="guest-card">
        <button id="btn-google-login" class="btn btn-google">
          <svg class="google-icon" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span id="txt-google-login">Войти через Google</span>
        </button>
      </div>
    </div>

    <div class="actions">
      <button id="btn-analyze" class="btn btn-primary">
        <span class="icon">💬</span>
        <span id="txt-analyze">Проанализировать в чате</span>
      </button>

      <button id="btn-save" class="btn btn-secondary">
        <span class="icon">💾</span>
        <span id="txt-save">Сохранить страницу</span>
      </button>

      <button id="btn-open-chat" class="btn btn-outline">
        <span class="icon">🚀</span>
        <span id="txt-open-chat">Открыть AI Чат</span>
      </button>
    </div>

    <div class="footer">
      <button id="btn-options" class="btn-link" title="Настройки">
        ⚙️ <span id="txt-options">Настройки</span>
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
