name: "Docs - Build & Deploy"

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: true

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements-docs.txt ]; then pip install -r requirements-docs.txt; else pip install mkdocs mkdocs-material mkdocstrings; fi

    - name: Build docs
      run: mkdocs build

    - name: Deploy to Read the Docs
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
      run: |
        echo "Documentation will be automatically built and deployed by Read the Docs"
        echo "Triggering Read the Docs build via webhook..."
        curl -X POST https://readthedocs.org/api/v2/webhook/ai-breadboard/12345/ \
          -H "Content-Type: application/json" \
          -d '{"push": true}'
      env:
        RTD_WEBHOOK_SECRET: ${{ secrets.RTD_WEBHOOK_SECRET }}
