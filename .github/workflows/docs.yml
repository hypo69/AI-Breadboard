name: Documentation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs-requirements.txt

      - name: Build documentation
        run: |
          mkdocs build --strict


# Note: This workflow only validates that MkDocs builds successfully and does NOT publish documentation.
# Read the Docs should be used to build and publish the site (including PR previews).
