name: "Git LFS - validate and helper workflows"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      migrate_history:
        description: 'If true, perform git lfs migrate import and force-push rewritten history to origin (DANGEROUS)'
        required: false
        default: 'false'
      confirm_force_push:
        description: 'Type YES to confirm force-push when migrate_history is true'
        required: false
        default: ''

jobs:
  validate-and-auto-pr:
    name: Validate .gitattributes and create PR if missing
    runs-on: ubuntu-latest
    outputs:
      missing_patterns: ${{ steps.check-patterns.outputs.missing }}

    steps:
    - name: Checkout repository (with LFS)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        lfs: true

    - name: Setup Python (used for portable checks)
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install git-lfs
      run: |
        sudo apt-get update -y
        sudo apt-get install -y git-lfs || true
        git lfs install --local || true

    - name: Show .gitattributes
      run: |
        echo "--- .gitattributes ---"
        if [ -f .gitattributes ]; then cat .gitattributes; else echo "(no .gitattributes)"; fi

    - id: check-patterns
      name: Check required LFS patterns
      run: |
        python - <<'PY'
        import sys
        required = [
          'plugins/media_organizer/data/media_rag.json',
          'plugins/media_organizer/data/*',
          'src/ai/gemini/user_rags/*.faiss',
          'src/ai/gemini/user_rags/*.json',
          'src/**/user_rag_*.faiss',
          'src/**/user_rag_*.json'
        ]
        try:
          with open('.gitattributes','r') as f:
            g = f.read()
        except FileNotFoundError:
          g = ''
        miss = [p for p in required if p not in g]
        missing_flag = 'true' if miss else 'false'
        print(f"missing={missing_flag}", file=open('/github/output','w')) if False else None
        print(f"::set-output name=missing::{missing_flag}")
        if miss:
          print('Missing patterns:', miss)
          # dump missing list for later steps
          with open('.github/missing-lfs-patterns','w') as o:
            o.write('\n'.join(miss))
        sys.exit(0)
        PY

    - name: Append missing LFS patterns and push branch
      if: steps.check-patterns.outputs.missing == 'true'
      run: |
        BRANCH="chore/add-git-lfs-patterns-${{ github.run_id }}"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -b "$BRANCH"
        mkdir -p $(dirname .gitattributes) || true
        if [ ! -f .gitattributes ]; then echo "# Git LFS attributes" > .gitattributes; fi
        if [ -f .github/missing-lfs-patterns ]; then
          while IFS= read -r p; do
            if ! grep -Fq "$p" .gitattributes; then
              echo "$p filter=lfs diff=lfs merge=lfs -text" >> .gitattributes
            fi
          done < .github/missing-lfs-patterns
        fi
        git add .gitattributes
        git commit -m "chore: add git-lfs track patterns for large assets" || echo "no changes to commit"
        git push origin "$BRANCH"

    - name: Create PR for .gitattributes update
      if: steps.check-patterns.outputs.missing == 'true'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: 'chore/add-git-lfs-patterns-${{ github.run_id }}'
        title: 'chore: add git-lfs track patterns'
        body: |
          This PR adds required git-lfs patterns to .gitattributes to ensure large files are tracked.
          Generated automatically by CI.
        labels: automated,git-lfs
        committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>

  cross-platform-checks:
    name: Cross-platform LFS checks
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    needs: validate-and-auto-pr

    steps:
    - name: Checkout repository (with LFS)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        lfs: true

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install git-lfs
      run: |
        if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then sudo apt-get update -y && sudo apt-get install -y git-lfs || true; fi
        if [ "${{ matrix.os }}" = "macos-latest" ]; then brew install git-lfs || true; fi
        if [ "${{ matrix.os }}" = "windows-latest" ]; then choco install git-lfs -y || true; fi
        git lfs install --local || true

    - name: List files tracked by Git LFS
      run: |
        echo "--- git lfs ls-files ---"
        git lfs ls-files || true

    - name: Fail if any non-LFS file exceeds 90MB (portable check)
      run: |
        python - <<'PY'
        import os, subprocess
        files = subprocess.check_output(['git','ls-files']).decode().splitlines()
        big=[]
        for f in files:
          if os.path.isfile(f):
            size = os.path.getsize(f)
            if size > 90*1024*1024:
              # check if tracked by LFS
              try:
                out = subprocess.check_output(['git','lfs','ls-files','--name-only']).decode().splitlines()
              except subprocess.CalledProcessError:
                out = []
              if f not in out:
                big.append((f,size))
        if big:
          print('Found large non-LFS files:')
          for f,s in big:
            print(f, s)
          raise SystemExit(1)
        print('No offending large files found')
        PY

  migrate-history:
    name: Migrate history to Git LFS (dangerous)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.migrate_history == 'true'
    steps:
    - name: Checkout full repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        lfs: false

    - name: Ensure git-lfs installed
      run: |
        sudo apt-get update -y
        sudo apt-get install -y git-lfs || true
        git lfs install --local || true

    - name: Safety check - require explicit confirmation
      run: |
        if [ "${{ github.event.inputs.confirm_force_push }}" != "YES" ]; then
          echo "Migration requires explicit confirmation. Set confirm_force_push=YES";
          exit 1;
        fi

    - name: Create backup branch of current main
      run: |
        git fetch origin main
        git branch backup-before-lfs-migration-$(date +%s) origin/main
        git push origin --set-upstream backup-before-lfs-migration-$(date +%s)

    - name: Run git lfs migrate for target files
      run: |
        git lfs migrate import --include="plugins/media_organizer/data/media_rag.json" --include-ref=refs/heads/main

    - name: Force-push rewritten main
      env:
        GIT_AUTHOR_NAME: github-actions[bot]
        GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      run: |
        git push origin +HEAD:main

    - name: Create PR to notify about migration
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: migrated large files to git-lfs (automated)'
        branch: 'chore/lfs-migration-notes-${{ github.run_id }}'
        title: 'chore: Git LFS migration performed'
        body: |
          The repository history on main was rewritten to migrate large files to Git LFS.
          A backup branch was created before the force-push.
          This operation was performed automatically by CI at user request.
          If you have local clones, please fetch and reset your local main to the updated history:

            git fetch origin
            git checkout main
            git reset --hard origin/main

          Please review and coordinate with collaborators.
        labels: automated,git-lfs
        committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
        assignees: ''

