<!-- Add / Edit MCP Server Modal -->
<div class="modal fade" id="mcpServerModal" tabindex="-1" aria-labelledby="mcpServerModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content shadow-lg">
      <div class="modal-header">
        <h5 class="modal-title d-flex align-items-center gap-2" id="mcpServerModalLabel">
          <i class="bi bi-hdd-network-fill text-primary"></i> <span id="mcp-modal-title-text"><span data-i18n="auto__mcp__b16057"></span></span>
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <!-- Preset Selector -->
        <div class="mb-3 p-3 bg-body-tertiary rounded border" id="mcp-preset-container">
          <label class="form-label text-info small fw-bold mb-1 d-flex align-items-center gap-1">
            <i class="bi bi-magic"></i> <span data-i18n="auto___83f6dc"></span> (Presets)
          </label>
          <div class="d-flex gap-2 flex-wrap">
            <button type="button" class="btn btn-sm btn-outline-primary" onclick="window.mcpTab?.applyPreset('playwright')">🌐 Playwright (Browser)</button>
            <button type="button" class="btn btn-sm btn-outline-info" onclick="window.mcpTab?.applyPreset('filesystem')">📁 Filesystem</button>
            <button type="button" class="btn btn-sm btn-outline-success" onclick="window.mcpTab?.applyPreset('memory')">🧠 Memory</button>
            <button type="button" class="btn btn-sm btn-outline-warning" onclick="window.mcpTab?.applyPreset('sqlite')">🗄️ SQLite</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="window.mcpTab?.applyPreset('fetch')">🌍 Fetch / HTTP</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="window.mcpTab?.applyPreset('sse')">⚡ Remote SSE / HTTP</button>
          </div>
        </div>

        <form id="mcp-server-form" onsubmit="window.mcpTab?.saveServer(event)">
          <input type="hidden" id="mcp-form-mode" value="create">

          <div class="row g-3">
            <div class="col-md-6">
              <label for="mcp-server-id" class="form-label small text-muted">ID <span data-i18n="auto___02f54d"></span>) <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="mcp-server-id" placeholder="<span data-i18n="auto___57685a"></span>, playwright" required pattern="[a-zA-Z0-9_-]+">
              <div class="form-text text-muted small"><span data-i18n="auto___3132de"></span>.</div>
            </div>

            <div class="col-md-6">
              <label for="mcp-server-name" class="form-label small text-muted"><span data-i18n="auto___403372"></span></label>
              <input type="text" class="form-control" id="mcp-server-name" placeholder="Playwright Web Browser">
            </div>

            <div class="col-12">
              <label for="mcp-server-desc" class="form-label small text-muted"><span data-i18n="auto___f5441f"></span></label>
              <input type="text" class="form-control" id="mcp-server-desc" placeholder="<span data-i18n="auto___7eac07"></span>">
            </div>

            <div class="col-md-6">
              <label for="mcp-server-transport" class="form-label small text-muted"><span data-i18n="auto___26fbec"></span> <span class="text-danger">*</span></label>
              <select class="form-select" id="mcp-server-transport" onchange="window.mcpTab?.onTransportChange()">
                <option value="stdio">stdio (<span data-i18n="auto___0a5f4b"></span> subprocess)</option>
                <option value="sse">sse (Server-Sent Events <span data-i18n="auto___4420c2"></span> HTTP)</option>
                <option value="streamable_http">streamable_http (HTTP Streaming)</option>
              </select>
            </div>

            <div class="col-md-6 d-flex align-items-center pt-4">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="mcp-server-enabled" checked>
                <label class="form-check-label" for="mcp-server-enabled"><span data-i18n="auto___011b36"></span></label>
              </div>
            </div>

            <!-- Stdio Section -->
            <div class="col-12 mcp-field-stdio" id="mcp-stdio-container">
              <div class="mb-3">
                <label for="mcp-server-command" class="form-label small text-muted"><span data-i18n="auto___0fe234"></span> (Command) <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="mcp-server-command" placeholder="npx, python, node, uvx">
                <div class="form-text text-muted small"><span data-i18n="auto___b75fcc"></span> PATH.</div>
              </div>

              <div class="mb-3">
                <label for="mcp-server-args" class="form-label small text-muted"><span data-i18n="auto___3c3a07"></span> (Arguments)</label>
                <input type="text" class="form-control" id="mcp-server-args" placeholder="@playwright/mcp@latest <span data-i18n="auto___414f95"></span>">
                <div class="form-text text-muted small"><span data-i18n="auto__json__a9941d"></span>.</div>
              </div>

              <div>
                <label for="mcp-server-env" class="form-label small text-muted"><span data-i18n="auto___858794"></span> (Environment JSON / Key-Value)</label>
                <textarea class="form-control font-monospace" id="mcp-server-env" rows="2" placeholder='{"NODE_ENV": "production"}'></textarea>
                <div class="form-text text-muted small"><span data-i18n="auto__json__dc3f87"></span>.</div>
              </div>
            </div>

            <!-- Network URL Section -->
            <div class="col-12 mcp-field-network d-none" id="mcp-network-container">
              <label for="mcp-server-url" class="form-label small text-muted">URL <span data-i18n="auto___8fd6e5"></span> <span class="text-danger">*</span></label>
              <input type="url" class="form-control" id="mcp-server-url" placeholder="http://localhost:8080/sse">
              <div class="form-text text-muted small"><span data-i18n="auto__http_https_mcp__e9614f"></span>.</div>
            </div>
          </div>

          <div class="mt-4 d-flex justify-content-between align-items-center border-top pt-3">
            <button type="button" class="btn btn-outline-info btn-sm d-flex align-items-center gap-1 rounded-pill" id="btn-test-modal-server" onclick="window.mcpTab?.testCurrentForm()">
              <i class="bi bi-play-circle"></i> <span data-i18n="auto___a51abd"></span>
            </button>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-secondary rounded-pill px-3" data-bs-dismiss="modal"><span data-i18n="auto___0ec753"></span></button>
              <button type="submit" class="btn btn-primary rounded-pill px-3" id="mcp-btn-save-server"><span data-i18n="auto___486405"></span></button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
