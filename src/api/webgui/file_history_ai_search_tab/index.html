<!-- File History AI Search Tab -->
<style>
  .fh-container {
    padding: 0.75rem 1rem;
    max-width: 1400px;
    margin: 0 auto;
  }
  .fh-card {
    background: var(--bs-body-bg, #1e293b);
    border: 1px solid var(--bs-border-color, #334155);
    border-radius: 12px;
    padding: 1.25rem;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  }
  .fh-header {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 1rem 1.5rem;
    color: #f8fafc;
  }
  .fh-stat-card {
    background: rgba(30, 41, 59, 0.7);
    border: 1px solid var(--bs-border-color, #334155);
    border-radius: 10px;
    padding: 0.85rem 1.1rem;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .fh-stat-card:hover {
    transform: translateY(-2px);
    border-color: #3b82f6;
  }
  .fh-stat-val {
    font-size: 1.4rem;
    font-weight: 700;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  .fh-search-box {
    background: var(--bs-dark, #0f172a);
    border: 1px solid #3b82f6;
    border-radius: 12px;
    padding: 0.75rem 1.25rem;
  }
  .fh-result-card {
    border-left: 4px solid #3b82f6;
    background: var(--bs-body-bg, #1e293b);
    border-top: 1px solid var(--bs-border-color, #334155);
    border-right: 1px solid var(--bs-border-color, #334155);
    border-bottom: 1px solid var(--bs-border-color, #334155);
    border-radius: 8px;
    padding: 1rem;
    margin-bottom: 0.75rem;
    transition: background-color 0.15s ease;
  }
  .fh-result-card:hover {
    background: rgba(59, 130, 246, 0.05);
  }
  .fh-score-badge {
    font-size: 0.82rem;
    font-weight: 600;
    font-family: monospace;
  }
  .fh-snippet-box {
    background: rgba(0, 0, 0, 0.2);
    border-radius: 6px;
    padding: 0.6rem 0.85rem;
    font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 0.85rem;
    color: var(--bs-body-color, #cbd5e1);
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 120px;
    overflow-y: auto;
  }
</style>
