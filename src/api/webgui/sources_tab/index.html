<!-- Sources Registry Tab -->
<div class="container-fluid">
  <div class="alert alert-info d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3 shadow-sm">
    <div>
      <h5 class="mb-1"><i class="bi bi-collection-play me-2"></i>📑 <span data-i18n="auto___036472"></span></h5>
      <p class="mb-0 small text-secondary"><span data-i18n="auto___0ef454"></span>.</p>
    </div>
    <div>
      <button class="btn btn-outline-primary btn-sm rounded-pill" onclick="const t = document.querySelector('[data-bs-target=\'#tab-search\']'); if(t) t.click();">
        <i class="bi bi-globe2 me-1"></i> <span data-i18n="auto___7e36e0"></span> (MCP) →
      </button>
    </div>
  </div>

  <div class="row g-3">
    <!-- LEFT: Add new source -->
    <div class="col-4">
      <div class="card mb-3">
        <div class="card-header bg-dark text-white">
          <span>➕ <span data-i18n="auto___9b4344"></span></span>
        </div>
        <div class="card-body">
          <form id="form-add-source" onsubmit="event.preventDefault();">
            <div class="mb-2">
              <label for="new-source-id" class="form-label small fw-bold">ID (<span data-i18n="auto___f14150"></span>):</label>
              <input type="text" class="form-control form-control-sm" id="new-source-id"
                     placeholder="<span data-i18n="auto___bbc821"></span>: my_site" required>
            </div>
            <div class="mb-2">
              <label for="new-source-name" class="form-label small fw-bold"><span data-i18n="auto___3de498"></span>:</label>
              <input type="text" class="form-control form-control-sm" id="new-source-name"
                     placeholder="<span data-i18n="auto___bbc821"></span>: My Site" required>
            </div>
            <div class="mb-2">
              <label for="new-source-url" class="form-label small fw-bold">URL:</label>
              <input type="url" class="form-control form-control-sm" id="new-source-url"
                     placeholder="https://example.com" required>
            </div>
            <div class="mb-2">
              <label for="new-source-category" class="form-label small fw-bold"><span data-i18n="auto___19c858"></span>:</label>
              <select class="form-select form-select-sm" id="new-source-category">
                <option value="streaming">streaming — <span data-i18n="auto___975de8"></span></option>
                <option value="streaming_search">streaming_search — <span data-i18n="auto___c4d6d4"></span></option>
                <option value="metadata">metadata — <span data-i18n="auto___612c04"></span></option>
                <option value="embed_player">embed_player — <span data-i18n="auto___5aa849"></span></option>
                <option value="torrent">torrent — <span data-i18n="auto___fbea1d"></span></option>
                <option value="search">search — <span data-i18n="auto___4884fe"></span></option>
                <option value="other">other — <span data-i18n="auto___723e8f"></span></option>
              </select>
            </div>
            <div class="mb-3">
              <label for="new-source-description" class="form-label small fw-bold"><span data-i18n="auto___f5441f"></span>:</label>
              <textarea class="form-control form-control-sm" id="new-source-description" rows="2"
                        placeholder="<span data-i18n="auto___9c18d7"></span>"></textarea>
            </div>
            <div class="d-grid">
              <button type="button" class="btn btn-success btn-sm" id="btn-add-source">
                ➕ <span data-i18n="auto___559a87"></span>
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- JSON Raw Editor -->
      <div class="card">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
          <span>📄 JSON-<span data-i18n="auto___b112fb"></span></span>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-light btn-sm" id="btn-refresh-sources-json">
              <i class="bi bi-arrow-clockwise"></i>
            </button>
            <button class="btn btn-success btn-sm" id="btn-save-sources-json">
              <i class="bi bi-floppy"></i> <span data-i18n="auto___486405"></span> JSON
            </button>
          </div>
        </div>
        <div class="card-body p-2">
          <p class="small text-muted mb-2"><span data-i18n="auto__json__e65648"></span>.</p>
          <textarea
            id="sources-json-editor"
            class="form-control font-monospace"
            style="min-height: 250px; max-height: 250px; resize: none; font-size: 0.78rem;"
            spellcheck="false"
          ></textarea>
        </div>
      </div>
    </div>

    <!-- RIGHT: Sources Table -->
    <div class="col-8">
      <div class="card">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
          <span>📋 <span data-i18n="auto___f3693d"></span></span>
          <button class="btn btn-outline-light btn-sm" id="btn-refresh-sources">
            <i class="bi bi-arrow-clockwise"></i> <span data-i18n="auto___c2f668"></span>
          </button>
        </div>
        <div class="card-body p-0">
          <!-- Category filter -->
          <div class="p-2 border-bottom d-flex gap-2 flex-wrap align-items-center">
            <span class="small text-muted"><span data-i18n="auto___3a4e34"></span>:</span>
            <select class="form-select form-select-sm" id="sources-category-filter" style="width: auto;">
              <option value="all"><span data-i18n="auto___b3bf7e"></span></option>
              <option value="streaming"><span data-i18n="auto___68db1c"></span></option>
              <option value="streaming_search"><span data-i18n="auto___71d2b6"></span></option>
              <option value="metadata"><span data-i18n="auto___527c7d"></span></option>
              <option value="embed_player"><span data-i18n="auto___e455b9"></span></option>
              <option value="torrent"><span data-i18n="auto___93e9ba"></span></option>
              <option value="search"><span data-i18n="auto___9dcf25"></span></option>
              <option value="other"><span data-i18n="auto___8f96ca"></span></option>
            </select>
          </div>
          <!-- Table container with vertical scroll -->
          <div style="height: 500px; overflow-y: scroll; overflow-x: auto;">
            <table class="table table-striped table-hover align-middle mb-0" id="sources-table" style="min-width: 600px;">
              <thead class="table-dark">
                <tr>
                  <th style="width: 5%;">On</th>
                  <th style="width: 15%;"><span data-i18n="auto___3de498"></span></th>
                  <th style="width: 25%;">URL</th>
                  <th style="width: 15%;"><span data-i18n="auto___19c858"></span></th>
                  <th style="width: 25%;"><span data-i18n="auto___f5441f"></span></th>
                  <th style="width: 15%;" class="text-end"><span data-i18n="auto___9978ac"></span></th>
                </tr>
              </thead>
              <tbody id="sources-list-body" style="word-wrap: break-word; overflow-wrap: break-word;">
                <tr>
                  <td colspan="6" class="text-center py-4 text-muted"><span data-i18n="auto___7ccee8"></span>...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Save all button at bottom -->
  <div class="mt-3 text-end">
    <button class="btn btn-primary" id="btn-save-all-sources">
      <i class="bi bi-floppy"></i> <span data-i18n="auto___cbe26c"></span>
    </button>
  </div>
</div>
