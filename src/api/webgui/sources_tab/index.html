<!-- Sources Registry Tab -->
<div class="container-fluid">
  <div class="alert alert-info d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3 shadow-sm">
    <div>
      <h5 class="mb-1"><i class="bi bi-collection-play me-2"></i>📑 Реестр источников данных</h5>
      <p class="mb-0 small text-secondary">Управление списком сайтов, стримингов и парсеров для медиатеки.</p>
    </div>
    <div>
      <button class="btn btn-outline-primary btn-sm rounded-pill" onclick="const t = document.querySelector('[data-bs-target=\'#tab-search\']'); if(t) t.click();">
        <i class="bi bi-globe2 me-1"></i> Настройки веб-поиска (MCP) →
      </button>
    </div>
  </div>

  <div class="row g-3">
    <!-- LEFT: Add new source -->
    <div class="col-4">
      <div class="card mb-3">
        <div class="card-header bg-dark text-white">
          <span>➕ Добавить источник</span>
        </div>
        <div class="card-body">
          <form id="form-add-source" onsubmit="event.preventDefault();">
            <div class="mb-2">
              <label for="new-source-id" class="form-label small fw-bold">ID (уникальный):</label>
              <input type="text" class="form-control form-control-sm" id="new-source-id"
                     placeholder="Например: my_site" required>
            </div>
            <div class="mb-2">
              <label for="new-source-name" class="form-label small fw-bold">Название:</label>
              <input type="text" class="form-control form-control-sm" id="new-source-name"
                     placeholder="Например: My Site" required>
            </div>
            <div class="mb-2">
              <label for="new-source-url" class="form-label small fw-bold">URL:</label>
              <input type="url" class="form-control form-control-sm" id="new-source-url"
                     placeholder="https://example.com" required>
            </div>
            <div class="mb-2">
              <label for="new-source-category" class="form-label small fw-bold">Категория:</label>
              <select class="form-select form-select-sm" id="new-source-category">
                <option value="streaming">streaming — стриминг</option>
                <option value="streaming_search">streaming_search — поиск стримингов</option>
                <option value="metadata">metadata — метаданные</option>
                <option value="embed_player">embed_player — встроенный плеер</option>
                <option value="torrent">torrent — торрент-трекер</option>
                <option value="search">search — поисковик</option>
                <option value="other">other — другое</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="new-source-description" class="form-label small fw-bold">Описание:</label>
              <textarea class="form-control form-control-sm" id="new-source-description" rows="2"
                        placeholder="Краткое описание источника"></textarea>
            </div>
            <div class="d-grid">
              <button type="button" class="btn btn-success btn-sm" id="btn-add-source">
                ➕ Добавить
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- JSON Raw Editor -->
      <div class="card">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
          <span>📄 JSON-редактор</span>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-light btn-sm" id="btn-refresh-sources-json">
              <i class="bi bi-arrow-clockwise"></i>
            </button>
            <button class="btn btn-success btn-sm" id="btn-save-sources-json">
              <i class="bi bi-floppy"></i> Сохранить JSON
            </button>
          </div>
        </div>
        <div class="card-body p-2">
          <p class="small text-muted mb-2">Прямое редактирование JSON. Используйте с осторожностью.</p>
          <textarea
            id="sources-json-editor"
            class="form-control font-monospace"
            style="min-height: 250px; max-height: 250px; resize: none; font-size: 0.78rem;"
            spellcheck="false"
          ></textarea>
        </div>
      </div>
    </div>

    <!-- RIGHT: Sources Table -->
    <div class="col-8">
      <div class="card">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
          <span>📋 Список источников</span>
          <button class="btn btn-outline-light btn-sm" id="btn-refresh-sources">
            <i class="bi bi-arrow-clockwise"></i> Обновить
          </button>
        </div>
        <div class="card-body p-0">
          <!-- Category filter -->
          <div class="p-2 border-bottom d-flex gap-2 flex-wrap align-items-center">
            <span class="small text-muted">Фильтр:</span>
            <select class="form-select form-select-sm" id="sources-category-filter" style="width: auto;">
              <option value="all">Все категории</option>
              <option value="streaming">Стриминг</option>
              <option value="streaming_search">Поиск стримингов</option>
              <option value="metadata">Метаданные</option>
              <option value="embed_player">Встроенные плееры</option>
              <option value="torrent">Торренты</option>
              <option value="search">Поисковики</option>
              <option value="other">Другое</option>
            </select>
          </div>
          <!-- Table container with vertical scroll -->
          <div style="height: 500px; overflow-y: scroll; overflow-x: auto;">
            <table class="table table-striped table-hover align-middle mb-0" id="sources-table" style="min-width: 600px;">
              <thead class="table-dark">
                <tr>
                  <th style="width: 5%;">On</th>
                  <th style="width: 15%;">Название</th>
                  <th style="width: 25%;">URL</th>
                  <th style="width: 15%;">Категория</th>
                  <th style="width: 25%;">Описание</th>
                  <th style="width: 15%;" class="text-end">Действия</th>
                </tr>
              </thead>
              <tbody id="sources-list-body" style="word-wrap: break-word; overflow-wrap: break-word;">
                <tr>
                  <td colspan="6" class="text-center py-4 text-muted">Загрузка источников...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Save all button at bottom -->
  <div class="mt-3 text-end">
    <button class="btn btn-primary" id="btn-save-all-sources">
      <i class="bi bi-floppy"></i> Сохранить все изменения
    </button>
  </div>
</div>
