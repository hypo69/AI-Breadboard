<!-- Instructions Tab -->
<div class="container-fluid p-3">
  <div class="alert alert-info">
    <h5 class="mb-1"><i class="bi bi-gear"></i> <span data-i18n="auto___890578"></span></h5>
    <p class="mb-0 small"><span data-i18n="auto__ai_narrator__c47a38"></span>.</p>
  </div>

  <!-- Mode Switcher -->
  <div class="card mb-3">
    <div class="card-body">
      <div class="d-flex align-items-center gap-2 flex-wrap">
        <span class="text-muted"><span data-i18n="auto___ff0fbd"></span>:</span>
        <div class="btn-group" role="group">
          <button type="button" class="btn btn-outline-primary active" id="mode-chat" onclick="switchMode('chat')">
            <i class="bi bi-chat-text"></i> Chat
          </button>
          <button type="button" class="btn btn-outline-secondary" id="mode-narrator" onclick="switchMode('narrator')">
            <i class="bi bi-mic"></i> Narrator
          </button>
        </div>
        <small class="text-muted ms-2"><span data-i18n="auto___f0d94d"></span>: <code id="active-file-info">—</code></small>
        <div class="ms-auto d-flex gap-2">
          <button type="button" class="btn btn-success" id="btn-check-model" onclick="checkInModel()">
            <i class="bi bi-check-circle"></i> <span data-i18n="auto___6c1f5b"></span>
          </button>
          <button type="button" class="btn btn-primary" id="btn-save" onclick="saveInstruction()">
            <i class="bi bi-save"></i> <span data-i18n="auto___0bd291"></span>
          </button>
          <button type="button" class="btn btn-warning" id="btn-preview" onclick="previewPrompt()">
            <i class="bi bi-eye"></i> <span data-i18n="auto___5d092c"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Editor Area -->
  <div class="card mb-3">
    <div class="card-header">
      <div class="d-flex justify-content-between align-items-center">
        <span class="fw-bold"><span data-i18n="auto___65d42c"></span> — <span id="editor-mode-label">💬 Chat</span></span>
        <small class="text-muted">Markdown <span data-i18n="auto___697fc7"></span></small>
      </div>
    </div>
    <div class="card-body p-0">
      <textarea id="instruction-editor" class="form-control border-0 rounded-0" rows="18"
        placeholder="<span data-i18n="auto___e1298e"></span>..." spellcheck="false"
        style="font-family: 'Courier New', monospace; font-size: 0.9rem; resize: vertical;"></textarea>
    </div>
  </div>

  <!-- Versions Panel -->
  <div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span class="fw-bold"><i class="bi bi-clock-history"></i> <span data-i18n="auto___2f7bd2"></span></span>
      <button type="button" class="btn btn-sm btn-outline-secondary" onclick="refreshVersions()">
        <i class="bi bi-arrow-clockwise"></i> <span data-i18n="auto___c2f668"></span>
      </button>
    </div>
    <div class="card-body p-0">
      <div id="versions-list" class="list-group list-group-flush">
        <div class="list-group-item text-muted"><span data-i18n="auto___bb436b"></span>...</div>
      </div>
    </div>
  </div>

  <!-- Token Counter -->
  <div class="card">
    <div class="card-header">
      <span class="fw-bold"><i class="bi bi-calculator"></i> <span data-i18n="auto___a77d7f"></span></span>
    </div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-4">
          <div class="p-3 bg-light rounded text-center">
            <div class="h3 mb-0" id="char-count">0</div>
            <div class="small text-muted"><span data-i18n="auto___1a1de3"></span></div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="p-3 bg-light rounded text-center">
            <div class="h3 mb-0" id="word-count">0</div>
            <div class="small text-muted"><span data-i18n="auto___dfd6c1"></span></div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="p-3 bg-light rounded text-center">
            <div class="h3 mb-0" id="token-estimate">~0</div>
            <div class="small text-muted"><span data-i18n="auto___2d505d"></span>)</div>
          </div>
        </div>
      </div>
      <div class="mt-3 small text-muted border rounded p-2" id="token-preview" style="min-height:2rem;"></div>
    </div>
  </div>
</div>

<!-- Prompt Preview Modal -->
<div class="modal fade" id="prompt-preview-modal" tabindex="-1" aria-labelledby="prompt-preview-modal-label" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="prompt-preview-modal-label"><span data-i18n="auto___4d167e"></span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="prompt-preview-content">
        <p><span data-i18n="auto___c98fa8"></span>...</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><span data-i18n="auto___4ae50d"></span></button>
      </div>
    </div>
  </div>
</div>
