<!-- Process Manager Tab -->
<div class="container-fluid py-2 px-3">
  <!-- Top Stat Cards -->
  <div class="row g-2 mb-3">
    <div class="col-6 col-md-3">
      <div class="card bg-dark text-white border-secondary h-100 shadow-sm p-3">
        <div class="text-muted small text-uppercase fw-semibold">Всего процессов ⚡</div>
        <div class="fs-4 fw-bold mt-1 text-primary" id="pm-total-count">--</div>
        <div class="small text-muted mt-1" id="pm-total-sub">tasklist / wmic</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card bg-dark text-white border-secondary h-100 shadow-sm p-3">
        <div class="text-muted small text-uppercase fw-semibold">Потоков (Threads) 🧵</div>
        <div class="fs-4 fw-bold mt-1 text-info" id="pm-threads-count">--</div>
        <div class="small text-muted mt-1" id="pm-threads-sub">Активные треды</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card bg-dark text-white border-secondary h-100 shadow-sm p-3">
        <div class="text-muted small text-uppercase fw-semibold">Использование ОЗУ 🧠</div>
        <div class="fs-4 fw-bold mt-1 text-success" id="pm-ram-usage">--</div>
        <div class="small text-muted mt-1" id="pm-ram-sub">Working Set (Память)</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card bg-dark text-white border-secondary h-100 shadow-sm p-3">
        <div class="text-muted small text-uppercase fw-semibold">Дескрипторы (Handles) 🗝️</div>
        <div class="fs-4 fw-bold mt-1 text-warning" id="pm-handles-count">--</div>
        <div class="small text-muted mt-1" id="pm-handles-sub">Открытые хэндлы</div>
      </div>
    </div>
  </div>

  <!-- Action Bar -->
  <div class="d-flex align-items-center justify-content-between mb-3 p-2 bg-dark rounded border border-secondary flex-wrap gap-2">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-sm btn-primary d-flex align-items-center gap-1.5" id="pm-refresh-btn">
        <i class="bi bi-arrow-clockwise"></i>
        <span>Обновить процессы</span>
      </button>
    </div>
    <div class="d-flex align-items-center gap-2">
      <input type="text" class="form-control form-control-sm bg-dark text-white border-secondary" id="pm-search-input" placeholder="Поиск по имени процесса или PID..." style="width: 260px;">
    </div>
  </div>

  <!-- Process Table -->
  <div class="card bg-dark text-white border-secondary shadow-sm">
    <div class="card-header border-secondary d-flex align-items-center justify-content-between py-2 px-3">
      <span class="fw-semibold"><i class="bi bi-cpu text-primary me-2"></i>Диспетчер процессов Windows</span>
      <span class="badge bg-secondary" id="pm-table-badge">0 процессов</span>
    </div>
    <div class="card-body p-0 table-responsive" style="max-height: 520px; overflow-y: auto;">
      <table class="table table-dark table-hover table-striped align-middle mb-0 small" id="pm-table">
        <thead class="sticky-top bg-dark">
          <tr class="text-secondary">
            <th>PID</th>
            <th>Имя процесса</th>
            <th>Сессия</th>
            <th>Использование памяти</th>
            <th>Статус</th>
            <th class="text-end">Действия</th>
          </tr>
        </thead>
        <tbody id="pm-tbody">
          <tr><td colspan="6" class="text-center text-muted py-4">Опрос активных процессов...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
