<script>
  // Мгновенная прямая инициализация бейджа активной модели из FastAPI
  (async function initActiveModelBadge() {
    try {
      const isTc = window.location.pathname.startsWith('/tc');
      const query = isTc ? '?profile=tc' : '';
      const res = await fetch('/api/chat/active-model' + query);
      if (res.ok) {
        const data = await res.json();
        const badgeText = document.getElementById('apps-model-text');
        const badge = document.getElementById('apps-model-badge');
        if (badgeText && data.provider && data.model) {
          badgeText.textContent = data.provider.toUpperCase() + ': ' + data.model;
          if (badge) {
            badge.title = 'Используемая модель: ' + data.model + ' (Провайдер: ' + data.provider.toUpperCase() + (data.config_file ? ', Профиль: ' + data.config_file : '') + ')';
          }
        }
      }
    } catch (e) {
      console.warn('[AppsHub] Inline badge init error:', e);
    }
  })();
</script>
