<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Breadboard — Приложения (/apps)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/html/css/main.css?v=20260915_light_v2" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/i18next@23.11.5/i18next.min.js"></script>
</head>
<body>

<div class="container-fluid mt-2" id="apps-interface">

  <!-- Navigation Bar (Apps Only) -->
  <div class="d-flex align-items-center justify-content-between mb-3 main-nav-container rounded px-2 py-1 flex-wrap gap-2">
    <!-- Brand / Title -->
    <div class="d-flex align-items-center gap-2 me-2">
      <span class="fs-5">📱</span>
      <span class="fw-bold text-white fs-6">AI Breadboard Apps</span>
      <span class="badge bg-danger-subtle text-danger border border-danger-subtle ms-1" style="font-size: 0.7rem;">Standalone /apps</span>
    </div>

    <!-- Apps Tab Buttons -->
    <ul class="nav nav-pills flex-nowrap flex-grow-1 border-0 align-items-center overflow-x-auto" id="appsNavTabs" style="gap: 4px;">
      <li class="nav-item">
        <button class="nav-link active d-flex align-items-center gap-1 py-1 px-2.5 small" data-tab="tab-chat" data-bs-target="#tab-chat" type="button">
          💬 <span>Чат</span>
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link d-flex align-items-center gap-1 py-1 px-2.5 small" data-tab="tab-network" data-bs-target="#tab-network" type="button">
          🌐 <span>Сетевой терминал</span>
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link d-flex align-items-center gap-1 py-1 px-2.5 small" data-tab="tab-system-inspector" data-bs-target="#tab-system-inspector" type="button">
          🖥️ <span>Системный инспектор</span>
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link d-flex align-items-center gap-1 py-1 px-2.5 small" data-tab="tab-windows-admin" data-bs-target="#tab-windows-admin" type="button">
          🛡️ <span>Windows Sysadmin</span>
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link d-flex align-items-center gap-1 py-1 px-2.5 small" data-tab="tab-system-control" data-bs-target="#tab-system-control" type="button">
          🛠️ <span>System Control</span>
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link d-flex align-items-center gap-1 py-1 px-2.5 small" data-tab="tab-system-logs" data-bs-target="#tab-system-logs" type="button">
          📜 <span>System Logs</span>
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link d-flex align-items-center gap-1 py-1 px-2.5 small" data-tab="tab-cloudflared" data-bs-target="#tab-cloudflared" type="button">
          ☁️ <span>Cloudflared</span>
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link d-flex align-items-center gap-1 py-1 px-2.5 small" data-tab="tab-gcloud" data-bs-target="#tab-gcloud" type="button">
          ☁️ <span>Google Cloud</span>
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link d-flex align-items-center gap-1 py-1 px-2.5 small" data-tab="tab-website-monitor" data-bs-target="#tab-website-monitor" type="button">
          📊 <span>Website Intelligence</span>
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link d-flex align-items-center gap-1 py-1 px-2.5 small" data-tab="tab-trading" data-bs-target="#tab-trading" type="button">
          📈 <span>Торговый терминал</span>
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link d-flex align-items-center gap-1 py-1 px-2.5 small" data-tab="tab-user-assistant" data-bs-target="#tab-user-assistant" type="button">
          🗓️ <span>User Assistant</span>
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link d-flex align-items-center gap-1 py-1 px-2.5 small" data-tab="tab-helpdesk" data-bs-target="#tab-helpdesk" type="button">
          🎧 <span>Helpdesk</span>
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link d-flex align-items-center gap-1 py-1 px-2.5 small" data-tab="tab-wikipedia-research" data-bs-target="#tab-wikipedia-research" type="button">
          🌐 <span>Wikipedia Lab</span>
        </button>
      </li>
    </ul>

    <!-- Controls (Theme, Language, Full Admin link) -->
    <div class="d-flex align-items-center gap-2 flex-shrink-0 ms-auto">
      <!-- Language Selector -->
      <select class="form-select form-select-sm bg-dark text-white border-secondary lang-selector" id="apps-lang-selector" style="width: 100px;">
        <option value="ru">Русский</option>
        <option value="en">English</option>
        <option value="he">עברית</option>
      </select>

      <!-- Theme Selector -->
      <select class="form-select form-select-sm bg-dark text-white border-secondary theme-selector" id="apps-theme-selector" style="width: 105px;">
        <option value="dark">🌙 Тёмная</option>
        <option value="light">☀️ Светлая</option>
        <option value="system">🌓 Система</option>
      </select>

      <!-- Link to full Admin Dashboard -->
      <a href="/admin" class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1 px-2 py-1" title="Открыть полную панель управления">
        <i class="bi bi-gear-fill"></i>
        <span class="small d-none d-md-inline">Админка</span>
      </a>
    </div>
  </div>

  <!-- Main Tab Content Container (Apps Only) -->
  <div class="tab-content" id="mainTabContent">
    <!-- Chat Tab -->
    <div id="tab-chat" class="tab-pane fade show active"></div>

    <!-- Network Terminal Tab -->
    <div id="tab-network" class="tab-pane fade"></div>

    <!-- System Inspector Tab -->
    <div id="tab-system-inspector" class="tab-pane fade"></div>

    <!-- Windows System Administrator Tab -->
    <div id="tab-windows-admin" class="tab-pane fade"></div>

    <!-- System Control Center Tab -->
    <div id="tab-system-control" class="tab-pane fade"></div>

    <!-- System Log Viewer Tab -->
    <div id="tab-system-logs" class="tab-pane fade"></div>

    <!-- Cloudflared Monitor Tab -->
    <div id="tab-cloudflared" class="tab-pane fade"></div>

    <!-- Google Cloud Monitor Tab -->
    <div id="tab-gcloud" class="tab-pane fade"></div>

    <!-- Website Intelligence Monitor Tab -->
    <div id="tab-website-monitor" class="tab-pane fade"></div>

    <!-- Exchange Trading Terminal Tab -->
    <div id="tab-trading" class="tab-pane fade"></div>

    <!-- User Assistant Tab -->
    <div id="tab-user-assistant" class="tab-pane fade"></div>

    <!-- Helpdesk Tab -->
    <div id="tab-helpdesk" class="tab-pane fade"></div>

    <!-- Wikipedia Research Lab Tab -->
    <div id="tab-wikipedia-research" class="tab-pane fade"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/html/js/chatService.js?v=20260915_v1"></script>
<script src="/html/js/appConfigEditor.js"></script>
<script type="module" src="/html/apps/main.js"></script>

</body>
</html>
