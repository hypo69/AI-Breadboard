<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title><span data-i18n="auto___992636"></span> - AI Breadboard</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  
  <!-- Telegram Web Apps SDK & Marked.js -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <style>
    :root {
      --tg-theme-bg-color: #0b0f19;
      --tg-theme-text-color: #f1f5f9;
      --tg-theme-hint-color: #94a3b8;
      --tg-theme-secondary-bg-color: #151c2e;
      --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      --mic-idle-gradient: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      --mic-listening-gradient: linear-gradient(135deg, #10b981 0%, #047857 100%);
      --mic-thinking-gradient: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
      --accent-color: #38bdf8;
    }
    
    body {
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding: 12px;
      margin: 0;
      overflow-x: hidden;
    }
    
    .app-container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 94vh;
    }
    
    .card-panel {
      background-color: var(--tg-theme-secondary-bg-color);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
    }
    
    /* Giant Mic Button */
    .mic-centerpiece {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 0 12px;
      position: relative;
    }

    .mic-button-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .btn-mic-giant {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: none;
      outline: none;
      background: var(--mic-idle-gradient);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      box-shadow: 0 8px 25px rgba(239, 68, 68, 0.4);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      z-index: 2;
    }

    .btn-mic-giant:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 30px rgba(239, 68, 68, 0.6);
    }

    .btn-mic-giant:active {
      transform: scale(0.95);
    }

    .btn-mic-giant.listening {
      background: var(--mic-listening-gradient);
      box-shadow: 0 8px 30px rgba(16, 185, 129, 0.5);
      animation: mic-listening-pulse 1.8s infinite;
    }

    .btn-mic-giant.thinking {
      background: var(--mic-thinking-gradient);
      box-shadow: 0 8px 30px rgba(139, 92, 246, 0.5);
      animation: mic-thinking-pulse 1.2s infinite ease-in-out;
    }

    @keyframes mic-listening-pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1.06); box-shadow: 0 0 0 22px rgba(16, 185, 129, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    @keyframes mic-thinking-pulse {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.05); }
      100% { transform: rotate(360deg) scale(1); }
    }

    /* Wave visualizer dots */
    .wave-bars {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 20px;
      margin-top: 8px;
    }
    
    .wave-bar {
      width: 4px;
      height: 6px;
      background: #ef4444;
      border-radius: 2px;
      transition: height 0.15s ease;
    }

    .wave-bars.active .wave-bar {
      background: #10b981;
      animation: wave-anim 0.8s ease-in-out infinite alternate;
    }

    .wave-bars.active .wave-bar:nth-child(2) { animation-delay: 0.15s; }
    .wave-bars.active .wave-bar:nth-child(3) { animation-delay: 0.3s; }
    .wave-bars.active .wave-bar:nth-child(4) { animation-delay: 0.45s; }
    .wave-bars.active .wave-bar:nth-child(5) { animation-delay: 0.2s; }

    @keyframes wave-anim {
      0% { height: 6px; }
      100% { height: 20px; }
    }

    /* Media Actions Bar */
    .media-actions-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      width: 100%;
    }

    .btn-media-action {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-media-action:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn-media-action.active-audio {
      border-color: #38bdf8;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
    }

    .btn-media-action.active-media {
      border-color: #a855f7;
      color: #c084fc;
      background: rgba(168, 85, 247, 0.1);
    }

    /* Chat Messages Container */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 44vh;
      min-height: 180px;
      scroll-behavior: smooth;
    }

    .chat-container::-webkit-scrollbar {
      width: 5px;
    }
    .chat-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }

    .chat-bubble {
      max-width: 90%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.92rem;
      line-height: 1.45;
      word-break: break-word;
      position: relative;
    }

    .chat-bubble.user {
      align-self: flex-end;
      background: var(--primary-gradient);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .chat-bubble.ai {
      align-self: flex-start;
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom-left-radius: 4px;
    }

    .chat-bubble.ai p:last-child {
      margin-bottom: 0;
    }

    .chat-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 4px;
      font-size: 0.72rem;
      opacity: 0.75;
    }

    .btn-speak-again {
      background: none;
      border: none;
      color: inherit;
      padding: 0;
      cursor: pointer;
      font-size: 0.85rem;
    }

    /* Media Attachment Previews */
    .media-preview-card {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .media-player-widget {
      width: 100%;
      margin-top: 6px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.2);
    }

    .media-thumb-img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 8px;
      margin-top: 6px;
      object-fit: cover;
    }

    /* Language and Theme Switchers */
    .btn-lang-pill {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
    }

    .theme-toggle-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .theme-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    /* Input text area fallback */
    .form-control-custom {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border-radius: 12px;
    }
    .form-control-custom:focus {
      background: rgba(0, 0, 0, 0.35);
      border-color: #3b82f6;
      color: #ffffff;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
    }

    /* Light Theme */
    body.theme-light {
      --tg-theme-bg-color: #f8fafc;
      --tg-theme-text-color: #0f172a;
      --tg-theme-hint-color: #64748b;
      --tg-theme-secondary-bg-color: #ffffff;
    }
    body.theme-light .card-panel {
      border-color: #e2e8f0;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }
    body.theme-light .chat-container {
      background: #f1f5f9;
      border-color: #e2e8f0;
    }
    body.theme-light .chat-bubble.ai {
      background: #ffffff;
      color: #0f172a;
      border-color: #e2e8f0;
    }
    body.theme-light .theme-toggle-btn {
      background: #e2e8f0;
      color: #0f172a;
      border-color: #cbd5e1;
    }
    body.theme-light .btn-media-action {
      background: #f1f5f9;
      color: #334155;
      border-color: #cbd5e1;
    }
    body.theme-light .form-control-custom {
      background: #ffffff;
      color: #0f172a;
      border-color: #cbd5e1;
    }
  </style>
</head>

  <script>
    // Global State
    let recognition = null;
    let isListening = false;
    let isTtsEnabled = true;
    let chatHistory = [];
    let abortController = null;
    let currentSpeechAudio = null;
    let currentSpeechQueue = null;

    // Elements
    const authPanel = document.getElementById('auth-panel');
    const mainPanel = document.getElementById('main-panel');
    const authAlert = document.getElementById('auth-alert');
    const authFormLogin = document.getElementById('auth-form-login');
    const authFormRegister = document.getElementById('auth-form-register');
    const authFormVerify = document.getElementById('auth-form-verify');

    const btnMic = document.getElementById('btn-mic');
    const micIcon = document.getElementById('mic-icon');
    const voiceStatusText = document.getElementById('voice-status-text');
    const voiceSubtext = document.getElementById('voice-subtext');
    const waveBars = document.getElementById('wave-bars');
    const chatFeed = document.getElementById('chat-feed');
    const emptyFeedHint = document.getElementById('empty-feed-hint');
    const userDisplayName = document.getElementById('user-display-name');

    const btnUploadAudio = document.getElementById('btn-upload-audio');
    const btnUploadMedia = document.getElementById('btn-upload-media');
    const btnClipAttachment = document.getElementById('btn-clip-attachment');
    const audioFileInput = document.getElementById('audio-file-input');
    const mediaFileInput = document.getElementById('media-file-input');

    const textSendForm = document.getElementById('text-send-form');
    const textInput = document.getElementById('text-input');
    const ttsToggleBtn = document.getElementById('tts-toggle-btn');
    const ttsIcon = document.getElementById('tts-icon');
    const btnClearChat = document.getElementById('btn-clear-chat');

    // Telegram Web App Integration
    function initTelegram() {
      if (window.Telegram && window.Telegram.WebApp) {
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        window.triggerHaptic = function(type = 'light') {
          if (tg.HapticFeedback) {
            tg.HapticFeedback.impactOccurred(type);
          }
        };
      } else {
        window.triggerHaptic = function() {};
      }
    }

    // Auth API
    const api = {
      async fetch(url, options = {}) {
        const res = await fetch(url, options);
        if (!res.ok) {
          let msg = res.statusText;
          try {
            const data = await res.json();
            msg = data.detail || msg;
          } catch {}
          throw new Error(msg);
        }
        return res.json();
      },
      auth: {
        async check() {
          try {
            const res = await fetch('/auth/check');
            return await res.json();
          } catch {
            return { authenticated: false };
          }
        },
        async login(email, password) {
          return api.fetch('/auth/login/email', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
        },
        async register(email, password, name) {
          return api.fetch('/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },

    // Audio Queue Player for Backend TTS
    class AudioQueuePlayer {
      constructor(chunks) {
        this.chunks = chunks;
        this.currentIndex = 0;
        this.isPlaying = false;
        this.audioElements = new Map();
        this.activeAudio = null;
        this._prefetch(0);
        this._prefetch(1);
      }

      _prefetch(index) {
        if (index >= this.chunks.length || this.audioElements.has(index)) return;
        const text = this.chunks[index];
        const queryParams = new URLSearchParams({ text });
        const audioUrl = `/api/tts/synthesize?${queryParams.toString()}`;
        const audio = new Audio(audioUrl);
        audio.load();
        this.audioElements.set(index, audio);
      }

      async play() {
        this.isPlaying = true;
        while (this.currentIndex < this.chunks.length && this.isPlaying) {
          this._prefetch(this.currentIndex + 1);
          this._prefetch(this.currentIndex + 2);

          const audio = this.audioElements.get(this.currentIndex);
          if (!audio) {
            this.currentIndex++;
            continue;
          }

          this.activeAudio = audio;
          currentSpeechAudio = audio;

          const playPromise = new Promise((resolve) => {
            audio.onended = () => resolve();
            audio.onerror = () => {
              this.stop();
              resolve();
            };
          });

          try {
            await audio.play();
            await playPromise;
          } catch (err) {
            console.error('Audio playback interrupted:', err);
          }
          this.currentIndex++;
        }
        this.isPlaying = false;
      }

      stop() {
        this.isPlaying = false;
        if (this.activeAudio) {
          try {
            this.activeAudio.pause();
            this.activeAudio.src = '';
          } catch (e) {}
        }
        this.audioElements.clear();
      }
    }

    function stopAudio() {
      if (currentSpeechQueue) {
        try { currentSpeechQueue.stop(); } catch (e) {}
        currentSpeechQueue = null;
      }
      if (currentSpeechAudio) {
        try {
          currentSpeechAudio.pause();
          currentSpeechAudio.src = '';
        } catch (e) {}
        currentSpeechAudio = null;
      }
      if ('speechSynthesis' in window) {
        try { window.speechSynthesis.cancel(); } catch (e) {}
      }
    }

    async function speakText(text) {
      if (!isTtsEnabled || !text) return;
      stopAudio();

      const cleanText = text.replace(/<[^>]*>/g, '').replace(/[*_`#]/g, '').trim();
      if (!cleanText) return;

      // Try Backend TTS
      try {
        const paragraphs = cleanText.split(/\n+/).map(p => p.trim()).filter(Boolean);
        let chunks = [];
        for (const para of paragraphs) {
          const sentences = para.match(/[^.!?]+[.!?]*/g) || [para];
          let currentChunk = '';
          for (const s of sentences) {
            const tr = s.trim();
            if (!tr) continue;
            if ((currentChunk + ' ' + tr).length > 200) {
              chunks.push(currentChunk.trim());
              currentChunk = tr;
            } else {
              currentChunk = (currentChunk + ' ' + tr).trim();
            }
          }
          if (currentChunk) chunks.push(currentChunk.trim());
        }
        chunks = chunks.filter(Boolean);

        if (chunks.length > 0) {
          currentSpeechQueue = new AudioQueuePlayer(chunks);
          await currentSpeechQueue.play();
          return;
        }
      } catch (e) {
        console.warn('Backend TTS failed, falling back to Web Speech Synthesis:', e);
      }

      // Fallback: Browser SpeechSynthesis
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(cleanText);
        const selectedLang = document.querySelector('input[name="lang-radio"]:checked')?.value || 'ru-RU';
        utterance.lang = selectedLang;
        window.speechSynthesis.speak(utterance);
      }
    }
