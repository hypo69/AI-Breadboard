<!-- Windows System Administrator Application Tab -->
<style>
  .winadmin-container {
    padding: 0.5rem 0.75rem;
  }
  .winadmin-table {
    width: 100%;
    font-size: 0.78rem;
    font-family: var(--font-mono, monospace);
    border-collapse: collapse;
  }
  .winadmin-table th {
    background: var(--surface-2);
    padding: 5px 8px;
    color: var(--text-muted);
    font-weight: 600;
    border-bottom: 1px solid var(--border-color);
  }
  .winadmin-table td {
    padding: 4px 8px;
    border-bottom: 1px solid var(--border-subtle, rgba(51, 65, 85, 0.4));
  }
  .winadmin-filter-btn.active {
    background-color: #3b82f6 !important;
    color: #fff !important;
    border-color: #3b82f6 !important;
  }
  .badge-hidden {
    background-color: #6b21a8;
    color: #e9d5ff;
    border: 1px solid #9333ea;
  }
  .badge-admin {
    background-color: #9a3412;
    color: #ffedd5;
    border: 1px solid #ea580c;
  }
  .badge-disabled {
    background-color: #374151;
    color: #9ca3af;
  }
</style>

<div class="winadmin-container theme-sysadmin">
  <!-- Header Alert & Status (Compact Strip) -->
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2 py-1.5 px-3 rounded-2 text-white" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); border: 1px solid #334155;">
    <div class="d-flex align-items-center gap-2 flex-wrap">
      <span class="fs-5">🛡️</span>
      <span class="fw-bold text-white small" style="font-size: 0.92rem;">Windows System Administrator</span>
      <span class="badge bg-dark border border-secondary text-info fw-normal" style="font-size: 0.7rem;">AD & Security Auditing</span>
      <span class="text-secondary small d-none d-lg-inline" style="font-size: 0.76rem;">| <span data-i18n="auto___d8ddd0"></span></span>
    </div>
    <div class="d-flex align-items-center gap-1.5 flex-wrap">
      <span class="badge rounded-pill bg-success-subtle text-success border border-success px-2 py-1" style="font-size: 0.72rem;" id="winadmin-status-badge">
        ● <span data-i18n="auto___97b864"></span>
      </span>
      <button class="btn btn-xs btn-outline-info rounded-pill px-2.5 py-1" style="font-size: 0.75rem;" id="btn-winadmin-refresh">
        <i class="bi bi-arrow-clockwise me-1"></i> <span data-i18n="auto___c2f668"></span>
      </button>
      <button class="btn btn-xs btn-outline-warning rounded-pill px-2 py-1" style="font-size: 0.75rem;" id="btn-winadmin-config">
        <i class="bi bi-gear-fill me-1"></i> <span data-i18n="auto___7f17c7"></span>
      </button>
    </div>
  </div>

  <!-- Top Metrics Bar (Compact Density Grid) -->
  <div class="row g-2 mb-2">
    <div class="col-6 col-md-3">
      <div class="winadmin-card">
        <span class="winadmin-label"><span data-i18n="auto___7e5f72"></span></span>
        <div class="d-flex align-items-baseline justify-content-between mt-1">
          <span class="winadmin-value text-truncate" id="winadmin-hostname" style="font-size: 0.95rem;">-</span>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="winadmin-card">
        <span class="winadmin-label">Active Directory</span>
        <div class="d-flex align-items-baseline justify-content-between mt-1">
          <span class="winadmin-value text-info text-truncate" id="winadmin-ad-status" style="font-size: 0.9rem;"><span data-i18n="auto___40fea1"></span></span>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="winadmin-card">
        <span class="winadmin-label"><span data-i18n="auto___5f2e02"></span>)</span>
        <div class="d-flex align-items-baseline justify-content-between mt-1">
          <span class="winadmin-value text-success" id="winadmin-user-count">0</span>
          <span class="badge bg-dark border border-secondary text-muted small" id="winadmin-user-breakdown" style="font-size: 0.7rem;">0 <span data-i18n="auto___323a77"></span></span>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="winadmin-card">
        <span class="winadmin-label"><span data-i18n="auto___c329cc"></span></span>
        <div class="d-flex align-items-baseline justify-content-between mt-1">
          <span class="winadmin-value text-warning" id="winadmin-events-count">0</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Panels Row 1: Users & Security Log -->
  <div class="row g-3 mb-3">
    <!-- User Accounts & Sessions Panel -->
    <div class="col-lg-7">
      <div class="winadmin-panel h-100">
        <div class="winadmin-panel-header d-flex justify-content-between align-items-center flex-wrap gap-2">
          <div class="d-flex align-items-center gap-2">
            <span><i class="bi bi-people-fill me-1"></i> <span data-i18n="auto___495eb9"></span> Windows</span>
            <span class="badge bg-secondary" id="winadmin-users-badge">0 <span data-i18n="auto___becfc7"></span></span>
          </div>
          <!-- Filter Buttons Toolbar -->
          <div class="btn-group btn-group-sm" role="group" id="winadmin-user-filters">
            <button type="button" class="btn btn-outline-secondary py-0 px-2 winadmin-filter-btn active" data-filter="all"><span data-i18n="auto___fd08da"></span></button>
            <button type="button" class="btn btn-outline-secondary py-0 px-2 winadmin-filter-btn" data-filter="active"><span data-i18n="auto___e858f4"></span></button>
            <button type="button" class="btn btn-outline-secondary py-0 px-2 winadmin-filter-btn" data-filter="hidden"><span data-i18n="auto___ba3f7e"></span></button>
            <button type="button" class="btn btn-outline-secondary py-0 px-2 winadmin-filter-btn" data-filter="admins"><span data-i18n="auto___4acb34"></span></button>
          </div>
        </div>
        <div class="p-0 table-responsive" style="max-height: 380px; overflow-y: auto;">
          <table class="winadmin-table">
            <thead>
              <tr>
                <th><span data-i18n="auto___101dab"></span></th>
                <th><span data-i18n="auto___1cb3d2"></span> / SID</th>
                <th><span data-i18n="auto___8f4525"></span></th>
                <th><span data-i18n="auto___3e559b"></span></th>
                <th><span data-i18n="auto___f7f293"></span></th>
                <th style="text-align: right;"><span data-i18n="auto___4fe9c0"></span></th>
              </tr>
            </thead>
            <tbody id="winadmin-users-tbody">
              <tr><td colspan="6" class="text-center text-muted p-3"><span data-i18n="auto___59b621"></span>...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Security Events Audit Log Panel -->
    <div class="col-lg-5">
      <div class="winadmin-panel h-100">
        <div class="winadmin-panel-header">
          <span><i class="bi bi-shield-exclamation me-1"></i> <span data-i18n="auto___137664"></span></span>
          <span class="badge bg-secondary" id="winadmin-events-badge">0 <span data-i18n="auto___04ad7c"></span></span>
        </div>
        <div class="p-0 table-responsive" style="max-height: 380px; overflow-y: auto;">
          <table class="winadmin-table">
            <thead>
              <tr>
                <th><span data-i18n="auto___c80d7e"></span></th>
                <th>Event ID</th>
                <th><span data-i18n="auto___d9f964"></span></th>
                <th><span data-i18n="auto___9e917c"></span></th>
              </tr>
            </thead>
            <tbody id="winadmin-events-tbody">
              <tr><td colspan="4" class="text-center text-muted p-3"><span data-i18n="auto___0dadde"></span>...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
