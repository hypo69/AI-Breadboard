<div class="chat-container d-flex flex-row h-100 w-100 overflow-hidden gap-2" style="min-height: 0; height: calc(100vh - 95px);">
  <!-- Sessions Sidebar -->
  <aside class="chat-sidebar d-flex flex-column flex-shrink-0 p-2 border rounded" id="chat-sidebar" style="width: 250px; min-width: 250px; max-width: 250px; height: 100%;">
    <div class="d-flex align-items-center justify-content-between mb-2 flex-shrink-0">
      <button class="btn btn-primary btn-sm w-100 d-flex align-items-center justify-content-center gap-2" id="chat-new-session-btn" type="button" title="Начать новый диалог">
        <i class="bi bi-plus-lg"></i>
        <span>Новый чат</span>
      </button>
    </div>

    <!-- Sessions List -->
    <div class="chat-sessions-list flex-grow-1 overflow-auto d-flex flex-column gap-1 my-1" id="chat-sessions-list" style="min-height: 0;">
      <!-- Session items injected via JS -->
    </div>

    <!-- Sidebar Footer -->
    <div class="pt-2 border-top border-secondary-subtle d-flex align-items-center justify-content-between flex-shrink-0">
      <small class="text-muted" id="chat-sessions-count">0 чатов</small>
      <button class="btn btn-sm btn-link text-danger text-decoration-none p-0" id="chat-clear-all-sessions-btn" type="button" title="Удалить все чаты">
        <i class="bi bi-trash3 me-1"></i>Все
      </button>
    </div>
  </aside>

  <!-- Main Chat Conversation Area -->
  <main class="chat-main-area d-flex flex-column flex-grow-1 h-100 overflow-hidden" style="min-width: 0;">
    <!-- Top Session Header Bar -->
    <div class="chat-header-bar d-flex align-items-center justify-content-between p-1 px-2 mb-2 rounded border flex-shrink-0">
      <div class="d-flex align-items-center gap-2 flex-grow-1 overflow-hidden">
        <button class="btn btn-sm btn-outline-secondary py-0 px-2" id="chat-sidebar-toggle-btn" type="button" title="Показать/скрыть панель чатов">
          <i class="bi bi-layout-sidebar"></i>
        </button>
        <span class="fw-semibold text-truncate" id="chat-current-title" title="Текущий диалог">Новый чат</span>
        <button class="btn btn-sm btn-link text-muted p-0" id="chat-rename-current-btn" type="button" title="Переименовать диалог">
          <i class="bi bi-pencil-square"></i>
        </button>
      </div>

      <div class="d-flex align-items-center gap-1 flex-shrink-0">
        <button class="btn btn-sm btn-outline-secondary py-0 px-2" id="chat-clear-btn" type="button" title="Очистить текущий диалог">
          <i class="bi bi-eraser me-1"></i><span class="d-none d-sm-inline">Очистить</span>
        </button>
      </div>
    </div>

    <!-- Chat Messages Window -->
    <div class="chat-window flex-grow-1 mb-2 overflow-auto" id="chat-window"></div>

    <!-- Execution Status Indicator -->
    <div id="chat-status-indicator" class="d-none small text-muted mb-2 d-flex align-items-center gap-2 flex-shrink-0">
      <span class="spinner-border spinner-border-sm text-primary" role="status" aria-hidden="true"></span>
      <span id="chat-status-text">Обработка запроса...</span>
    </div>

    <!-- Query Input & Settings Bar -->
    <div class="d-flex flex-wrap align-items-center gap-2 flex-shrink-0">
      <!-- RAG Search Toggle Switch -->
      <div class="form-check form-switch d-flex align-items-center gap-1 m-0">
        <input class="form-check-input mt-0" type="checkbox" role="switch" id="chat-rag-toggle" checked title="Использовать базу знаний (RAG)">
        <label class="form-check-label small fw-semibold text-muted text-nowrap user-select-none" for="chat-rag-toggle" title="Использовать базу знаний (RAG)">
          <i class="bi bi-database-check me-1"></i>RAG
        </label>
      </div>

      <!-- TOP_K Setting -->
      <div class="d-flex align-items-center gap-1">
        <label for="chat-top-k" class="small fw-semibold text-muted text-nowrap">TOP_K:</label>
        <input type="number" class="form-control form-control-sm" id="chat-top-k" value="3" min="1" max="50" style="width: 75px;" title="Количество результатов (TOP_K)">
      </div>

      <!-- MIN_SCORE Setting -->
      <div class="d-flex align-items-center gap-1">
        <label for="chat-min-score" class="small fw-semibold text-muted text-nowrap">MIN_SCORE:</label>
        <input type="number" class="form-control form-control-sm" id="chat-min-score" value="0.45" min="0.0" max="1.0" step="0.05" style="width: 85px;" title="Минимальный порог (MIN_SCORE)">
      </div>

      <!-- Output Mode (Text only / Voice only / Text and Voice) -->
      <div class="d-flex align-items-center gap-1">
        <label for="chat-output-mode" class="small fw-semibold text-muted text-nowrap user-select-none" title="Режим вывода ответа">
          <i class="bi bi-sliders me-1"></i>Режим:
        </label>
        <select class="form-select form-select-sm" id="chat-output-mode" style="width: auto; min-width: 145px;" title="Режим вывода ответа">
          <option value="text_only">💬 Только текст</option>
          <option value="text_and_voice" selected>💬+🔊 Текст и голос</option>
          <option value="voice_only">🔊 Только голос</option>
        </select>
      </div>

      <!-- Message Input and Send Button -->
      <div class="input-group flex-grow-1">
        <input type="text" class="form-control" id="message-input" placeholder="Введите сообщение..." autocomplete="off" data-lpignore="true" data-1p-ignore="true">
        <button class="btn btn-primary" id="send-button" type="button">Отправить</button>
      </div>
    </div>
  </main>
</div>
