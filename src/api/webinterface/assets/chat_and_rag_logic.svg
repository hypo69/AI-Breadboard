<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 920" width="100%" height="100%" style="background:#0b0f19; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-user" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-dec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="grad-local" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="grad-success" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="grad-ai-local" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="grad-ai-ext" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="grad-notfound" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Marker Arrow -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <g transform="translate(40, 30)">
    <text x="0" y="24" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="-0.5">🧠 Архитектура и алгоритм диспетчеризации ответов чата</text>
    <text x="0" y="48" fill="#94a3b8" font-size="13">Система многоуровневой RAG-фильтрации, интеграции с локальной медиатекой и интернет-поиском</text>
  </g>

  <!-- 1. Input Node -->
  <g transform="translate(380, 100)" filter="url(#shadow)">
    <rect width="300" height="54" rx="12" fill="url(#grad-user)" stroke="#60a5fa" stroke-width="1.5" />
    <text x="150" y="28" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">💬 Запрос пользователя</text>
    <text x="150" y="44" fill="#bfdbfe" font-size="11" text-anchor="middle">«Расскажи о сериале...», «Включи...»</text>
  </g>

  <!-- Line 1 to Decision 1 -->
  <line x1="530" y1="154" x2="530" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 2. Decision: Is Media Query? -->
  <g transform="translate(390, 190)" filter="url(#shadow)">
    <rect width="280" height="60" rx="10" fill="url(#grad-dec)" stroke="#6366f1" stroke-width="1.5" />
    <text x="140" y="26" fill="#e0e7ff" font-size="13" font-weight="600" text-anchor="middle">🎬 Относится к кино/медиа?</text>
    <text x="140" y="44" fill="#a5b4fc" font-size="11" text-anchor="middle">фильм, сериал, включи, порекомендуй...</text>
  </g>

  <!-- Branch Non-Media (Left) -->
  <path d="M 390 220 L 170 220 L 170 280" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="230" y="206" width="60" height="20" rx="4" fill="#1e293b" />
  <text x="260" y="220" fill="#94a3b8" font-size="11" text-anchor="middle">НЕТ</text>

  <!-- Non-Media Node -->
  <g transform="translate(60, 285)" filter="url(#shadow)">
    <rect width="220" height="64" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <text x="110" y="26" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="middle">🤖 Прямой ответ LLM</text>
    <text x="110" y="44" fill="#94a3b8" font-size="11" text-anchor="middle">Общий диалог, код, справка</text>
    <text x="110" y="56" fill="#64748b" font-size="10" text-anchor="middle">+ озвучка Narrator TTS</text>
  </g>

  <!-- Branch Media (Down) -->
  <line x1="530" y1="250" x2="530" y2="285" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)" />
  <rect x="535" y="258" width="40" height="18" rx="4" fill="#1e293b" />
  <text x="555" y="271" fill="#38bdf8" font-size="11" text-anchor="middle">ДА</text>

  <!-- 3. RAG Mode Check Node -->
  <g transform="translate(380, 290)" filter="url(#shadow)">
    <rect width="300" height="54" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="150" y="24" fill="#f1f5f9" font-size="13" font-weight="600" text-anchor="middle">⚙️ Режим RAG (config.json)</text>
    <text x="150" y="42" fill="#c4b5fd" font-size="11" text-anchor="middle">rag (только база) | rag+model | model</text>
  </g>

  <!-- Line from Mode to Local Search -->
  <line x1="530" y1="344" x2="530" y2="380" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 4. Local Search Node -->
  <g transform="translate(365, 385)" filter="url(#shadow)">
    <rect width="330" height="66" rx="10" fill="url(#grad-local)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="165" y="25" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">🔍 Поиск в локальной медиатеке</text>
    <text x="165" y="43" fill="#fef3c7" font-size="11" text-anchor="middle">1. Точный поиск по названию в media.db</text>
    <text x="165" y="58" fill="#fde68a" font-size="10.5" text-anchor="middle">2. Семантический FAISS (порог &gt;= 0.60)</text>
  </g>

  <!-- Line to Decision 2 -->
  <line x1="530" y1="451" x2="530" y2="485" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 5. Decision 2: Found in Local DB? -->
  <g transform="translate(370, 490)" filter="url(#shadow)">
    <rect width="320" height="58" rx="10" fill="url(#grad-dec)" stroke="#ec4899" stroke-width="1.5" />
    <text x="160" y="24" fill="#fdf2f8" font-size="13" font-weight="600" text-anchor="middle">🎯 Найден в локальной базе?</text>
    <text x="160" y="44" fill="#fbcfe8" font-size="11" text-anchor="middle">Точное совпадение названий ИЛИ Score &gt;= 0.60</text>
  </g>

  <!-- LEFT BRANCH: Found = YES -->
  <path d="M 370 519 L 240 519 L 240 575" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="260" y="505" width="80" height="20" rx="4" fill="#1e293b" />
  <text x="300" y="519" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">ДА (Найден)</text>

  <!-- 6. Decision: Play command? -->
  <g transform="translate(115, 580)" filter="url(#shadow)">
    <rect width="250" height="50" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="125" y="22" fill="#ecfdf5" font-size="12.5" font-weight="600" text-anchor="middle">Команда воспроизведения?</text>
    <text x="125" y="38" fill="#a7f3d0" font-size="11" text-anchor="middle">«Включи», «Запусти», «Play»</text>
  </g>

  <!-- Play = YES Branch -->
  <path d="M 115 605 L 50 605 L 50 670" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="58" y="593" width="40" height="18" rx="4" fill="#1e293b" />
  <text x="78" y="606" fill="#34d399" font-size="10.5" text-anchor="middle">ДА</text>

  <!-- Node: Direct Play -->
  <g transform="translate(10, 675)" filter="url(#shadow)">
    <rect width="180" height="150" rx="10" fill="url(#grad-success)" stroke="#34d399" stroke-width="1.5" />
    <text x="90" y="24" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">▶️ Direct Play</text>
    <text x="90" y="44" fill="#d1fae5" font-size="11" text-anchor="middle">Запуск на плеере</text>
    <text x="90" y="60" fill="#a7f3d0" font-size="10" text-anchor="middle">через WebSocket</text>
    <line x1="20" y1="72" x2="160" y2="72" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="90" y="92" fill="#ecfdf5" font-size="10.5" text-anchor="middle">Мгновенный старт</text>
    <text x="90" y="108" fill="#ecfdf5" font-size="10.5" text-anchor="middle">без вызова LLM</text>
    <text x="90" y="126" fill="#d1fae5" font-size="10" text-anchor="middle">+ голосовое подтверждение</text>
  </g>

  <!-- Play = NO Branch -->
  <line x1="240" y1="630" x2="240" y2="670" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="245" y="640" width="40" height="18" rx="4" fill="#1e293b" />
  <text x="265" y="653" fill="#94a3b8" font-size="10.5" text-anchor="middle">НЕТ</text>

  <!-- Node: LLM with Local Context (rag+model) -->
  <g transform="translate(205, 675)" filter="url(#shadow)">
    <rect width="215" height="150" rx="10" fill="url(#grad-ai-local)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="107" y="24" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">🎬 Локальный контекст</text>
    <text x="107" y="42" fill="#e0f2fe" font-size="11" font-weight="600" text-anchor="middle">(Режим: rag+model)</text>
    <line x1="15" y1="52" x2="200" y2="52" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="107" y="70" fill="#f0f9ff" font-size="11" text-anchor="middle">LLM формирует ответ:</text>
    <text x="107" y="88" fill="#e0f2fe" font-size="10.5" text-anchor="middle">• Фильм ЕСТЬ в медиатеке</text>
    <text x="107" y="104" fill="#e0f2fe" font-size="10.5" text-anchor="middle">• Сюжет, актёры, рейтинг</text>
    <text x="107" y="120" fill="#e0f2fe" font-size="10.5" text-anchor="middle">• Тег &lt;film&gt; для плеера</text>
    <text x="107" y="138" fill="#bae6fd" font-size="9.5" text-anchor="middle">+ голос Narrator TTS</text>
  </g>


  <!-- RIGHT BRANCH: Found = NO -->
  <path d="M 690 519 L 810 519 L 810 575" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#arrow-red)" />
  <rect x="705" y="505" width="90" height="20" rx="4" fill="#1e293b" />
  <text x="750" y="519" fill="#f87171" font-size="11" font-weight="600" text-anchor="middle">НЕТ (Отсутствует)</text>

  <!-- 7. Decision: Mode is RAG or RAG+Model? -->
  <g transform="translate(685, 580)" filter="url(#shadow)">
    <rect width="250" height="50" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" />
    <text x="125" y="22" fill="#fff1f2" font-size="12.5" font-weight="600" text-anchor="middle">Режим в конфигурации?</text>
    <text x="125" y="38" fill="#fecdd3" font-size="11" text-anchor="middle">rag (строгий) vs rag+model (гибрид)</text>
  </g>

  <!-- Mode = rag Branch (Right-most) -->
  <path d="M 935 605 L 980 605 L 980 670" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#arrow-red)" />
  <rect x="942" y="593" width="30" height="18" rx="4" fill="#1e293b" />
  <text x="957" y="606" fill="#f87171" font-size="10" text-anchor="middle">rag</text>

  <!-- Node: Return Not Found -->
  <g transform="translate(885, 675)" filter="url(#shadow)">
    <rect width="165" height="150" rx="10" fill="url(#grad-notfound)" stroke="#f87171" stroke-width="1.5" />
    <text x="82" y="24" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">❌ Не найдено</text>
    <text x="82" y="42" fill="#fee2e2" font-size="11" text-anchor="middle">(Режим: rag)</text>
    <line x1="15" y1="52" x2="150" y2="52" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="82" y="74" fill="#ffffff" font-size="11" text-anchor="middle">Чёткий ответ:</text>
    <text x="82" y="92" fill="#fee2e2" font-size="10.5" text-anchor="middle">«В локальной базе</text>
    <text x="82" y="108" fill="#fee2e2" font-size="10.5" text-anchor="middle">ничего не найдено»</text>
    <text x="82" y="128" fill="#fecaca" font-size="9.5" text-anchor="middle">Без чужих фильмов!</text>
  </g>

  <!-- Mode = rag+model Branch (Center-right) -->
  <path d="M 810 630 L 810 655 L 640 655 L 640 670" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple)" />
  <rect x="680" y="645" width="80" height="18" rx="4" fill="#1e293b" />
  <text x="720" y="658" fill="#c084fc" font-size="10.5" font-weight="600" text-anchor="middle">rag+model</text>

  <!-- Node: External Web Search + LLM -->
  <g transform="translate(525, 675)" filter="url(#shadow)">
    <rect width="235" height="150" rx="10" fill="url(#grad-ai-ext)" stroke="#a855f7" stroke-width="1.5" />
    <text x="117" y="24" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">🌐 Внешний поиск + ИИ</text>
    <text x="117" y="42" fill="#f3e8ff" font-size="11" font-weight="600" text-anchor="middle">(Режим: rag+model / fallback)</text>
    <line x1="15" y1="52" x2="220" y2="52" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="117" y="70" fill="#ffffff" font-size="11" text-anchor="middle">Web Search (MCP) / База LLM:</text>
    <text x="117" y="88" fill="#f3e8ff" font-size="10.5" text-anchor="middle">• Рассказ о «Сватах» / др.</text>
    <text x="117" y="104" fill="#f3e8ff" font-size="10.5" text-anchor="middle">• Указание: НЕТ на дисках</text>
    <text x="117" y="120" fill="#f3e8ff" font-size="10.5" text-anchor="middle">• &lt;film&gt; для поиска торрентов</text>
    <text x="117" y="138" fill="#e9d5ff" font-size="9.5" text-anchor="middle">+ голос Narrator TTS</text>
  </g>

  <!-- Bottom Legend Footer -->
  <g transform="translate(40, 860)">
    <rect width="980" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="20" r="5" fill="#34d399" />
    <text x="32" y="24" fill="#94a3b8" font-size="11">Локальный тайтл доступен</text>
    <circle cx="230" cy="20" r="5" fill="#a855f7" />
    <text x="242" y="24" fill="#94a3b8" font-size="11">Внешний веб-поиск (MCP/LLM)</text>
    <circle cx="470" cy="20" r="5" fill="#f87171" />
    <text x="482" y="24" fill="#94a3b8" font-size="11">Строгая фильтрация (без галлюцинаций)</text>
    <circle cx="760" cy="20" r="5" fill="#38bdf8" />
    <text x="772" y="24" fill="#94a3b8" font-size="11">Двухэтапная генерация (Текст + Голос)</text>
  </g>
</svg>
