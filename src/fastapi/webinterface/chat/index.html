<div class="chat-window mb-2" id="chat-window"></div>

<!-- Media Controls & Collapsible Player Panel -->
<div class="media-controls mb-2" id="media-controls">
  <style>
    #media-controls .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }
    #media-player-body {
      background: rgba(0, 0, 0, 0.2);
      border-top: 1px solid var(--border-color);
    }
    .player-window-wrapper {
      position: relative;
      width: 100%;
      height: 340px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 10px;
      border: 1px solid var(--border-color);
    }
    .player-glow {
      position: absolute;
      top: -20%;
      left: -20%;
      width: 140%;
      height: 140%;
      background: radial-gradient(circle, rgba(121, 40, 202, 0.15) 0%, transparent 60%);
      filter: blur(40px);
      z-index: 0;
      pointer-events: none;
      transition: background 1s ease;
    }
    .player-el {
      position: relative;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 2;
    }
    .player-video-tag {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .hidden {
      display: none !important;
    }
    /* Controls style overlay */
    .controls-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 75%, transparent 100%);
      padding: 10px 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.25s;
      z-index: 10;
    }
    .player-window-wrapper:hover .controls-overlay {
      opacity: 1;
    }
    .p-bar-track {
      height: 4px;
      background: rgba(255,255,255,0.25);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }
    .p-bar-fill {
      height: 100%;
      background: linear-gradient(135deg, #7928ca 0%, #ff007a 100%);
      width: 0%;
      border-radius: 2px;
    }
    .p-bar-hover {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: rgba(255,255,255,0.15);
      width: 0%;
      pointer-events: none;
    }
    .row-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .row-side {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .p-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .vol-slider {
      width: 50px;
      height: 3px;
      accent-color: #ff007a;
      cursor: pointer;
    }
    .speed-select-box {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 0.75rem;
      border-radius: 4px;
      padding: 2px 4px;
    }
    .player-placeholder-box {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(20,20,30,0.95);
      color: #8b949e;
      z-index: 1;
      text-align: center;
      padding: 20px;
    }
  </style>
  <div class="card">
    <!-- Header -->
    <div class="card-header p-2 d-flex align-items-center justify-content-between" style="cursor: pointer; background: transparent; border-bottom: none;" id="media-controls-header">
      <div class="d-flex align-items-center gap-2">
        <span class="text-muted small">▶️ Сейчас играет:</span>
        <strong id="now-playing-title" class="small text-info">—</strong>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-primary" id="btn-toggle-player-body">Развернуть плеер</button>
        <button class="btn btn-sm btn-outline-secondary" id="btn-close-player">✕</button>
      </div>
    </div>
    
    <!-- Collapsible Player and Inputs Container -->
    <div class="card-body p-3 d-none" id="media-player-body">
      <div class="row g-3">
        <!-- Left: URL Loader, Badges, History -->
        <div class="col-md-4 d-flex flex-column gap-2" style="border-right: 1px solid var(--border-color); padding-right: 15px;">
          <div>
            <h6 class="small text-uppercase text-muted fw-bold">Вставить ссылку</h6>
            <form id="cosmic-stream-form" class="d-flex gap-1">
              <input type="url" id="cosmic-stream-url" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="YouTube, VK, RuTube, Rezka, direct..." required>
              <button type="submit" class="btn btn-sm btn-primary">Запуск</button>
            </form>
          </div>
          
          <div>
            <h6 class="small text-uppercase text-muted fw-bold mt-1">Демо-источники</h6>
            <div class="d-flex flex-wrap gap-1" id="cosmic-provider-badges">
              <span class="badge bg-secondary text-white cursor-pointer" style="cursor:pointer" data-prov="youtube">YouTube</span>
              <span class="badge bg-secondary text-white cursor-pointer" style="cursor:pointer" data-prov="vk">VK</span>
              <span class="badge bg-secondary text-white cursor-pointer" style="cursor:pointer" data-prov="rutube">RuTube</span>
              <span class="badge bg-secondary text-white cursor-pointer" style="cursor:pointer" data-prov="direct">HLS (.m3u8)</span>
            </div>
          </div>

          <div class="flex-grow-1" style="overflow-y:auto; max-height:120px;">
            <h6 class="small text-uppercase text-muted fw-bold mt-1">История</h6>
            <div id="cosmic-history-list" class="d-flex flex-column gap-1">
              <div class="text-muted small text-center py-2">История пуста</div>
            </div>
          </div>
        </div>

        <!-- Right: Player Screen -->
        <div class="col-md-8">
          <div class="player-window-wrapper" id="cosmic-screen-container">
            <!-- Glow background -->
            <div class="player-glow" id="cosmic-ambient-glow"></div>
            
            <!-- Embedded frame -->
            <iframe id="cosmic-embed-player" class="player-el hidden" allowfullscreen allow="autoplay; encrypted-media"></iframe>

            <!-- HTML5 Video Tag -->
            <div id="cosmic-video-wrapper" class="player-el hidden">
              <video id="cosmic-video-element" class="player-video-tag"></video>
              
              <!-- Custom controls overlay -->
              <div class="controls-overlay">
                <div class="p-bar-track" id="cosmic-progress-container">
                  <div class="p-bar-fill" id="cosmic-progress-bar">
                    <div class="p-bar-hover"></div>
                  </div>
                </div>
                <div class="row-flex">
                  <div class="row-side">
                    <button class="p-btn" id="cosmic-play-btn">▶</button>
                    <button class="p-btn" id="cosmic-stop-btn">◼</button>
                    <span class="time-display small" style="font-size: 0.75rem;"><span id="cosmic-time-current">0:00</span> / <span id="cosmic-time-duration">0:00</span></span>
                  </div>
                  <div class="row-side">
                    <div class="d-flex align-items-center gap-1">
                      <button class="p-btn" id="cosmic-mute-btn">🔊</button>
                      <input type="range" id="cosmic-volume-slider" class="vol-slider" min="0" max="1" step="0.05" value="1">
                    </div>
                    <select id="cosmic-speed-select" class="speed-select-box">
                      <option value="0.5">0.5x</option>
                      <option value="1" selected>1.0x</option>
                      <option value="1.5">1.5x</option>
                      <option value="2">2.0x</option>
                    </select>
                    <button class="p-btn" id="cosmic-fullscreen-btn">⛶</button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Empty Placeholder -->
            <div id="cosmic-player-placeholder" class="player-placeholder-box">
              <span style="font-size: 2.5rem;">🎬</span>
              <h6 class="mt-2 mb-1">Плеер готов к работе</h6>
              <p class="small text-muted mb-0" style="font-size: 0.8rem;">Вставьте ссылку слева или нажмите на любой демо-источник</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- AI Model & Search Debugger Toolbar -->
<div class="card mb-2 border-secondary shadow-sm" id="chat-debugger-toolbar" style="background: var(--bg-color-card, #1c2128); border-radius: 8px;">
  <div class="card-body p-2 d-flex flex-wrap align-items-center justify-content-between gap-2" style="font-size: 0.82rem;">
    <div class="d-flex flex-wrap align-items-center gap-2">
      <!-- Section: Model (Internal Processing) -->
      <div class="d-flex align-items-center gap-1">
        <span class="text-info fw-bold d-flex align-items-center gap-1">
          <i class="bi bi-cpu-fill"></i> Модель:
        </span>
        <select class="form-select form-select-sm bg-dark text-white border-secondary font-monospace" id="chat-model-select" style="width: auto; min-width: 230px; font-size: 0.8rem;" title="Иерархический выбор модели ИИ для внутренней генерации">
          <option value="">Загрузка моделей...</option>
        </select>
        <button class="btn btn-sm btn-outline-warning d-flex align-items-center gap-1 fw-semibold" id="btn-chat-set-default-model" title="Установить выбранную модель ИИ как дефолтную для пользователя">
          <i class="bi bi-star-fill"></i> Дефолтная
        </button>
      </div>

      <span class="text-secondary opacity-50 d-none d-lg-inline">|</span>

      <!-- Section: Web Search Provider & Model -->
      <div class="d-flex align-items-center gap-1">
        <span class="text-info fw-bold d-flex align-items-center gap-1">
          <i class="bi bi-globe2"></i> Поиск:
        </span>
        <select class="form-select form-select-sm bg-dark text-white border-secondary font-monospace" id="chat-search-select" style="width: auto; min-width: 175px; font-size: 0.8rem;" title="Иерархический выбор провайдера и модели веб-поиска">
          <optgroup label="🌐 Поисковые провайдеры">
            <option value="gemini_cli">💻 Gemini CLI</option>
            <option value="gemini">♊ Gemini Grounding</option>
            <option value="agy">🚀 Antigravity (AGY)</option>
            <option value="playwright">🎭 Playwright MCP</option>
            <option value="langchain">🦜 LangChain MCP</option>
          </optgroup>
        </select>
        <button class="btn btn-sm btn-outline-info d-flex align-items-center gap-1 fw-semibold" id="btn-chat-set-default-search" title="Установить выбранный провайдер и модель поиска по умолчанию в config.json">
          <i class="bi bi-star-fill"></i> Дефолтный
        </button>
      </div>
    </div>

    <!-- Live Status Badges on the right -->
    <div class="d-flex align-items-center gap-1 ms-auto">
      <span class="badge bg-dark border border-secondary font-monospace" id="chat-model-badge" style="color: #58a6ff; font-size: 0.75rem; display: none;" title="Текущая активная модель"></span>
      <span class="badge bg-dark border border-secondary font-monospace" id="chat-search-badge" style="color: #38bdf8; font-size: 0.75rem; display: none;" title="Текущий провайдер поиска"></span>
    </div>
  </div>
</div>

<div class="input-group">
  <select class="form-select text-muted" id="chat-mode-selector" style="max-width: 170px; font-size: 0.85rem; border-color: var(--border-color); background-color: var(--bg-color-card); color: var(--text-color);">
    <option value="story" selected>📖 Сюжет</option>
    <option value="download">⚡ Найти и скачать</option>
  </select>
  <select class="form-select text-muted" id="chat-mode-debug" style="max-width: 100px; font-size: 0.85rem; border-color: var(--border-color); background-color: var(--bg-color-card); color: var(--text-color);">
    <option value="prod" selected>PROD</option>
    <option value="debug">DEBUG</option>
  </select>
  <input type="text" class="form-control" id="message-input" data-i18n-placeholder="chat.placeholder" placeholder="Введите сообщение...">
  <button class="btn btn-primary" id="send-button" data-i18n="chat.send">Отправить</button>
  <button class="btn btn-outline-info" id="chat-algo-btn" onclick="window.showChatLogicModal ? window.showChatLogicModal() : null" title="🧠 Схема и алгоритм логики ответов чата" style="padding: 0.375rem 0.65rem; font-size: 1rem;"><i class="bi bi-diagram-3-fill"></i></button>
  <button class="btn btn-outline-success" id="save-history-rag-btn" title="Сохранить всю историю в RAG" style="padding: 0.375rem 0.65rem; font-size: 1rem;">💾</button>
  <button class="btn btn-outline-secondary" id="clear-history-btn" title="Очистить историю чата" style="padding: 0.375rem 0.65rem; font-size: 1rem;">🗑️</button>
</div>

<!-- Modal for editing and saving chat history to RAG -->
<div class="modal fade" id="saveHistoryModal" tabindex="-1" aria-hidden="true" style="z-index: 1060;">
  <div class="modal-dialog modal-lg">
    <div class="modal-content" style="background: var(--bg-color-card, #2b3035); color: var(--text-color, #f8f9fa); border: 1px solid var(--border-color, #495057);">
      <div class="modal-header" style="border-bottom: 1px solid var(--border-color, #495057);">
        <h5 class="modal-title">💾 Сохранение истории чата в RAG</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label small fw-bold">Тема / Запрос (заголовок документа):</label>
          <input type="text" class="form-control bg-dark text-white border-secondary" id="saveHistoryTitleInput">
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">Содержимое диалога (отредактируйте, удалив всё ненужное):</label>
          <textarea class="form-control bg-dark text-white border-secondary font-monospace small" id="saveHistoryTextInput" rows="12"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">Описание для диктора (voice_text):</label>
          <textarea class="form-control bg-dark text-white border-secondary font-monospace small" id="saveHistoryVoiceInput" rows="3"></textarea>
        </div>
      </div>
      <div class="modal-footer" style="border-top: 1px solid var(--border-color, #495057);">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-primary btn-sm" id="btn-save-history-confirm">Сохранить в RAG</button>
      </div>
    </div>
  </div>
</div>
