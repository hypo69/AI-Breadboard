# Read the Docs configuration for AI Breadboard project.
# This file specifies the build environment, Python version,
# and MkDocs configuration file used to generate the project
# documentation and reference materials.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"

python:
  install:
    - method: pip
      path: .
    - requirements: requirements-docs.txt

mkdocs:
  configuration: mkdocs.yml
