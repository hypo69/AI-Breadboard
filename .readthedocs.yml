# Конфигурация сборки документации проекта для Read the Docs.
# Здесь задаются базовая среда, версия Python и входной файл
# конфигурации MkDocs, который используется для генерации
# проектной документации и справочных материалов.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"

python:
  version: 3.10
  install:
    - method: pip
      path: .
    - requirements: requirements-docs.txt

mkdocs:
  configuration: mkdocs.yml
